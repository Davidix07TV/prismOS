#!/usr/bin/env bash
# =============================================================================
#  prismOS :: profiles/home.conf
# -----------------------------------------------------------------------------
#  Profilo di build dell'edizione HOME. Sostituisce integralmente il precedente
#  profiles/games.conf: prismOS Home non e' una "gaming edition" ma l'edizione
#  domestica generalista, nella quale lo streaming multimediale e il gaming
#  leggero (cloud gaming e titoli Wine/Proton compatibili con Intel HD Gen5)
#  sono due casi d'uso fra gli altri.
#
#  Caricato con `source` da scripts/build_iso.sh prima di
#  overlays/overlay-prismos-home/make.conf; le variabili PRISMOS_* del make.conf
#  hanno precedenza su quelle qui definite.
# =============================================================================

# --- Identita' ----------------------------------------------------------------
PROFILE_ID="home"
DISPLAY_NAME="prismOS Home"
EDITION_TAGLINE="Streaming multimediale, comunicazione e gaming leggero"

BOARD="amd64-prismos"
OVERLAY_DIR="overlays/overlay-prismos-home"
OVERLAY_COMMON_DIR="overlays/overlay-prismos-common"

# --- Hardware di riferimento ---------------------------------------------------
# PC domestico ricondizionato: CPU dual/quad core senza SSE4.2, 4 GB di RAM,
# Intel HD Graphics Gen5. Il budget termico e' ridotto, quindi il profilo
# privilegia la decodifica video hardware (VA-API i965) rispetto al software.
TARGET_CPU="Intel Pentium P6100 (Arrandale) - SSE4.1, no SSE4.2/POPCNT"
MIN_RAM_MB="3072"
TARGET_GPU="Intel HD Graphics (Ironlake/Gen5) - driver crocus + i965"

# --- Kernel --------------------------------------------------------------------
KERNEL_VERSION="6.1"
KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
KERNEL_FRAGMENTS="base.config fragment.config legacy-cpu.config android.config wine.config"

# --- Immagine -------------------------------------------------------------------
IMAGE_TYPE="dev"
ROOTFS_VERIFICATION="false"
IMAGE_NAME_PATTERN="prismOS_%s_legacy.img"

# --- Sottosistemi di compatibilita' ----------------------------------------------
# HOME: entrambi i sottosistemi partono al boot. Waydroid serve le app Android
# di streaming che non hanno equivalente web completo (Netflix/Spotify mobile,
# client di messaggistica), Wine/Proton serve i titoli e gli installer Windows.
# Su Intel HD Gen5 il backend D3D e' obbligatoriamente wined3d (OpenGL GLSL,
# Shader Model 3): DXVK e VKD3D-Proton sono inutilizzabili per assenza di
# Vulkan, pertanto le USE -vkd3d-proton e -dxvk restano negate nell'overlay.
WAYDROID_BOOT_STATE="enabled"
WINE_BOOT_STATE="enabled"
SUBSYSTEM_IDLE_TIMEOUT="1800"
SUBSYSTEM_MAX_INSTANCES="2"
SUBSYSTEM_TEARDOWN="graceful"
SUBSYSTEM_TEARDOWN_GRACE_SEC="15"
# Backend Wine selezionato a runtime da prismos-wine-prepare in base al
# rilevamento del PCI ID: su Intel HD Gen5 -> wined3d (niente DXVK/VKD3D).
WINE_D3D_BACKEND="wined3d"
WINE_MAX_VRAM_MB="64"

# --- Multimedia ---------------------------------------------------------------------
# Widevine L3 via CDM di Chrome: su hardware legacy il livello L1 non e'
# disponibile, quindi lo streaming DRM e' vincolato a 720p (SD/HD).
DRM_ENGINE="widevine-l3"
STREAM_MAX_RESOLUTION="720p"
VIDEO_CODECS="h264 vp8 vp9 av1-decode-disabled"
AUDIO_CODECS="aac mp3 opus vorbis flac"
# Decodifica hardware dove supportata da i965 (H.264/VP8); VP9 e AV1 restano
# software per limiti del blocco VDBox Gen5.
VAAPI_ENABLED="1"
VAAPI_CODECS="h264 vp8 mpeg2"
HW_ACCELERATION_MODE="prefer-hardware"

# --- Dock macOS-like (Ash shelf) ---------------------------------------------------
SHELF_ALIGNMENT="Bottom"
SHELF_AUTOHIDE="Always"
SHELF_CENTERED="true"
SHELF_ICON_SIZE="56"
SHELF_SQUIRCLE_RADIUS="0.28"
SHELF_SQUIRCLE_EXPONENT="5.0"
SHELF_PIN_MAX="10"
SHELF_LAUNCHER_ACCELERATOR="super+space"
SHELF_WEB_SEARCH_ACCELERATOR="super+shift+space"
ICON_THEME="prismOS-Squircle"
# Animazioni e blur attivi: con >=3 GB di RAM il compositore Ash resta fluido.
SHELF_ANIMATIONS="1"
SHELF_BACKGROUND_BLUR="1"
SHELF_BACKGROUND_OPACITY="0.86"

# --- Policy ---------------------------------------------------------------------
# Nessuna policy di dispositivo: l'edizione domestica e' gestita dall'utente.
POLICY_MODE="none"
POLICY_SOURCE=""
POLICY_TARGET=""
EDU_DOMAIN=""
ENCRYPTED_DOWNLOADS="0"
GUEST_LOGIN_ALLOWED="1"
EPHEMERAL_USERS="0"

# --- Pacchetti ---------------------------------------------------------------------
EXTRA_PACKAGES=""
REMOVED_PACKAGES=""

# --- Albero rootfs dell'edizione -------------------------------------------------------
# Contiene /etc/prismos/home-tuning.conf: abilita i sottosistemi al boot,
# imposta il backend wined3d, il cap 720p, il governor powersave con boost
# schedutil e le preferenze Chromium per la decodifica VA-API.
ROOTFS_FILES="overlays/overlay-prismos-home/files"

# --- Servizi ------------------------------------------------------------------------
SERVICES_ENABLE="prismos-waydroid-container prismos-wine-session@1000 prismos-dock-apply prismos-accelerator-daemon prismos-subsystem-idle.timer prismos-firstboot"
SERVICES_DISABLE="arc-setup crostini"
SERVICES_MASK=""

# --- Note operative --------------------------------------------------------------------
NOTES="HOME e' l'edizione di default per l'uso domestico: Waydroid e Wine sono
attivi dal boot, lo streaming DRM e' limitato a 720p (Widevine L3) e la Dock
ospita fino a 10 applicazioni. Il gaming e' supportato solo per titoli che non
richiedono SSE4.2 ne' Vulkan; per il resto resta il cloud gaming (GeForce NOW)."
