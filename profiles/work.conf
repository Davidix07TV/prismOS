#!/usr/bin/env bash
# =============================================================================
#  prismOS :: profiles/work.conf
# -----------------------------------------------------------------------------
#  Profilo di build dell'edizione WORK. Caricato con `source` da
#  scripts/build_iso.sh prima di overlays/overlay-prismos-work/make.conf; le
#  variabili PRISMOS_* del make.conf hanno precedenza.
#
#  Tre pilastri dell'edizione:
#    1. Microsoft 365 - suite web fissata sulla Dock, con PWA offline per Word/
#       Excel/Outlook e sincronizzazione OneDrive via client web.
#    2. VPN avanzata - shill + OpenVPN con tls-crypt, autenticazione PKCS#11 su
#       smart card/token e kill-switch che abbatte il default route se il tunnel
#       cade.
#    3. Download cifrati - vault dm-crypt/LUKS su file loopback montato in
#       ~/Downloads, chiave sigillata nel TPM quando disponibile.
# =============================================================================

# --- Identita' ----------------------------------------------------------------
PROFILE_ID="work"
DISPLAY_NAME="prismOS Work"
EDITION_TAGLINE="Microsoft 365, VPN aziendale e Download cifrati"

BOARD="amd64-prismos"
OVERLAY_DIR="overlays/overlay-prismos-work"
OVERLAY_COMMON_DIR="overlays/overlay-prismos-common"

# --- Hardware di riferimento ---------------------------------------------------
# Notebook aziendale dismesso: CPU dual core senza SSE4.2, 4 GB di RAM, Intel HD
# Gen5, docking station con monitor esterno 1080p.
TARGET_CPU="Intel Pentium P6100 (Arrandale) - SSE4.1, no SSE4.2/POPCNT"
MIN_RAM_MB="3072"
TARGET_GPU="Intel HD Graphics (Ironlake/Gen5) - driver crocus + i965"

# --- Kernel --------------------------------------------------------------------
KERNEL_VERSION="6.1"
KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
KERNEL_FRAGMENTS="base.config fragment.config legacy-cpu.config android.config wine.config"
# dm-crypt/loopback/TPM sono gia' inclusi in fragment.config (CRYPTO_*,
# LOOP, TCG_TPM); niente frammento slim per non comprimere la memoria dei
# documenti aperti.

# --- Immagine -------------------------------------------------------------------
IMAGE_TYPE="dev"
ROOTFS_VERIFICATION="false"
IMAGE_NAME_PATTERN="prismOS_%s_legacy.img"

# --- Sottosistemi di compatibilita' ----------------------------------------------
# WORK: Wine attivo al boot per i pochi applicativi Windows ancora in uso
# (client gestionali, stampanti fiscali); Waydroid on-demand per le app di
# autenticazione a due fattori e per i client mobili aziendali.
WAYDROID_BOOT_STATE="on-demand"
WINE_BOOT_STATE="enabled"
SUBSYSTEM_IDLE_TIMEOUT="900"
SUBSYSTEM_MAX_INSTANCES="1"
SUBSYSTEM_TEARDOWN="graceful"
SUBSYSTEM_TEARDOWN_GRACE_SEC="15"
WINE_D3D_BACKEND="wined3d"
WINE_MAX_VRAM_MB="64"

# --- Microsoft 365 ---------------------------------------------------------------------
M365_PINNED="1"
M365_START_URL="https://www.office.com/?auth=2"
M365_PWA_SCOPE="https://www.office.com/"
M365_OFFLINE_APPS="word excel powerpoint outlook onenote"
# Il client desktop Outlook non esiste per Linux: si usa la PWA di Outlook con
# notifiche web push e la sincronizzazione IMAP/EWS ove richiesto.
M365_MAIL_PROTOCOL="ews-imap"
ONEDRIVE_MOUNT_MODE="webdav"

# --- VPN avanzata ----------------------------------------------------------------------
VPN_ENABLED="1"
VPN_MANAGER="shill"
VPN_BACKENDS="openvpn l2tp-ipsec"
VPN_OPENVPN_TLS_CRYPT="1"
VPN_PKCS11_PROVIDER="/usr/lib64/pkcs11/opensc-pkcs11.so"
VPN_PKCS11_MODULE="opensc"
# Kill-switch: se il tunnel cade, la route di default viene ritirata e il
# traffico non passa in chiaro (nessuna perdita di indirizzamento aziendale).
VPN_KILL_SWITCH="1"
VPN_DNS_OVER_TUNNEL="1"
VPN_SPLIT_TUNNEL_ALLOW=""
# Certificati CA aziendali aggiuntivi montati in /etc/ssl/certs/prismos/.
VPN_EXTRA_CA_DIR="overlays/overlay-prismos-work/files/etc/ssl/certs/prismos"

# --- Crittografia -----------------------------------------------------------------------
# Vault dm-crypt/LUKS su file loopback: /var/lib/prismos/vaults/downloads.img
# montato in ~/Downloads. Cifratura AES-XTS a 256 bit; su Arrandale AES-NI e'
# assente, quindi il kernel usa le tabelle software (CONFIG_CRYPTO_AES_X86_64
# non e' richiesto) e la dimensione del vault e' contenuta.
ENCRYPTED_DOWNLOADS="1"
VAULT_BACKEND="dm-crypt"
VAULT_PATH="/var/lib/prismos/vaults/downloads.img"
VAULT_MOUNTPOINT="/home/chronos/user/Downloads"
VAULT_SIZE_MB="4096"
VAULT_CIPHER="aes-xts-plain64"
VAULT_KEY_SIZE="256"
VAULT_HASH="sha256"
VAULT_FILESYSTEM="ext4"
# Sigillo TPM 2.0 (PCR 0,1,7) quando il TPM e' presente: sblocco automatico al
# boot senza passphrase. In assenza di TPM si ripiega sulla passphrase in
# /run/keys/prismos-vault (tmpfs, 0400, root:root).
VAULT_TPM_SEAL="auto"
VAULT_TPM_PCRS="0,1,7"
VAULT_UNLOCK_MODE="tpm-or-passphrase"
VAULT_IDLE_LOCK_MIN="30"

# --- Dock macOS-like (Ash shelf) ---------------------------------------------------
SHELF_ALIGNMENT="Bottom"
SHELF_AUTOHIDE="Always"
SHELF_CENTERED="true"
SHELF_ICON_SIZE="48"
SHELF_SQUIRCLE_RADIUS="0.28"
SHELF_SQUIRCLE_EXPONENT="5.0"
SHELF_PIN_MAX="8"
SHELF_LAUNCHER_ACCELERATOR="super+space"
SHELF_WEB_SEARCH_ACCELERATOR="super+shift+space"
ICON_THEME="prismOS-Squircle"
SHELF_ANIMATIONS="0"
SHELF_BACKGROUND_BLUR="0"
SHELF_BACKGROUND_OPACITY="0.94"

# --- Policy ---------------------------------------------------------------------
# Policy di dispositivo minimale: blocca i servizi di anonimizzazione (VPN web,
# proxy pubblici, torrent) che aggirerebbero il tunnel aziendale e impone il
# salvataggio dei file nel vault cifrato.
POLICY_MODE="local"
POLICY_SOURCE="overlays/overlay-prismos-work/files/etc/chromium/policies/managed/prismos_policy.json"
POLICY_TARGET="/etc/chromium/policies/managed/prismos_policy.json"
EDU_DOMAIN=""
# Directory di download forzata dentro il vault tramite --download-default-directory.
DOWNLOAD_DEFAULT_DIRECTORY="/home/chronos/user/Downloads"

# --- Autenticazione e auditing ------------------------------------------------------------
KERBEROS_ENABLED="1"
KERBEROS_REALM=""
KERBEROS_KEEP_TICKET="1"
AUDIT_LOG_ENABLED="1"
AUDIT_LOG_PATH="/var/log/prismos/audit.log"
AUDIT_LOG_RETENTION_DAYS="90"
# Blocco dello schermo dopo 10 minuti di inattivita' e all'avvio della sessione.
SCREEN_LOCK_TIMEOUT_SEC="600"
SCREEN_LOCK_ON_START="1"

# --- Pacchetti ---------------------------------------------------------------------
EXTRA_PACKAGES=""
REMOVED_PACKAGES=""

# --- Albero rootfs dell'edizione -------------------------------------------------------
# Contiene /etc/prismos/work.conf, /etc/default/chromium-browser (flag GPU e
# directory di download) e la policy Chromium di dispositivo.
ROOTFS_FILES="overlays/overlay-prismos-work/files"

# --- Servizi ------------------------------------------------------------------------
SERVICES_ENABLE="prismos-wine-session@1000 prismos-vault-downloads prismos-dock-apply prismos-accelerator-daemon prismos-audit-log prismos-firstboot"
SERVICES_DISABLE="prismos-waydroid-container arc-setup crostini"
SERVICES_MASK=""

# --- Note operative --------------------------------------------------------------------
NOTES="WORK presume una flotta gestita dall'azienda: la policy locale blocca i
servizi di anonimizzazione, i download finiscono nel vault LUKS e la VPN con
kill-switch e' obbligatoria per le risorse interne. Kerberos e smart card
PKCS#11 sono abilitati ma richiedono la configurazione del realm aziendale in
/etc/prismos/work.conf prima del primo avvio."
