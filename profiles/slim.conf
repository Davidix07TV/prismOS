#!/usr/bin/env bash
# =============================================================================
#  prismOS :: profiles/slim.conf
# -----------------------------------------------------------------------------
#  Profilo di build dell'edizione SLIM, destinata a macchine con meno di 2 GB di
#  RAM. Caricato con `source` da scripts/build_iso.sh prima di
#  overlays/overlay-prismos-slim/make.conf; le variabili PRISMOS_* del make.conf
#  hanno precedenza.
#
#  CONTRATTO FUNZIONALE DELL'EDIZIONE SLIM
#    1. Waydroid e Wine sono PRESENTI nell'immagine (USE waydroid wine attive,
#       pacchetti installati, MIME types registrati, .desktop files disponibili).
#    2. I loro demoni sono COMPLETAMENTE SPENTI al boot: le unita'
#         prismos-waydroid-container.service
#         prismos-waydroid-session@.service
#         prismos-wine-session@.service
#       non hanno alcuna sezione [Install] e nessun target le trascina;
#       prismos-subsystems.target e' disabilitato e
#       prismos-subsystem-idle.timer e' mascherato.
#    3. L'apertura di un file .apk/.xapk oppure .exe/.msi/.dll/.scr/.cpl/.com
#       attiva /usr/bin/prismos-slim-launcher (o prismos-wine-run), che esegue
#       `systemctl start` sul sottosistema richiesto, attende la readiness e
#       lancia l'applicazione.
#    4. Alla chiusura dell'applicazione il sottosistema viene terminato
#       (SIGTERM, poi SIGKILL dopo PRISMOS_SUBSYSTEM_TEARDOWN_GRACE_SEC) e i
#       mount, i cgroup e i prefissi temporanei vengono ripuliti.
#    5. Un solo sottosistema alla volta: la seconda richiesta chiude la prima.
# =============================================================================

# --- Identita' ----------------------------------------------------------------
PROFILE_ID="slim"
DISPLAY_NAME="prismOS Slim"
EDITION_TAGLINE="Sotto i 2 GB di RAM - sottosistemi attivati a richiesta"

BOARD="amd64-prismos"
OVERLAY_DIR="overlays/overlay-prismos-slim"
OVERLAY_COMMON_DIR="overlays/overlay-prismos-common"

# --- Hardware di riferimento ---------------------------------------------------
# Caso peggiore supportato: 1 GB di RAM, CPU dual core senza SSE4.2, disco
# meccanico o eMMC lento, Intel HD Gen5 con 64 MB di memoria video condivisa.
TARGET_CPU="Intel Pentium P6100 (Arrandale) - SSE4.1, no SSE4.2/POPCNT"
MIN_RAM_MB="1024"
TARGET_GPU="Intel HD Graphics (Ironlake/Gen5) - driver crocus + i965"
# Con meno di 1 GB di RAM l'immagine resta installabile ma Chrome degrada: il
# launcher avverte l'utente senza bloccare la build.
CRITICAL_RAM_MB="768"

# --- Kernel --------------------------------------------------------------------
KERNEL_VERSION="6.1"
KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
# SLIM aggiunge il frammento dedicato alla gestione della memoria: zram/zstd,
# PSI, memcg, zswap writeback. BPF_SYSCALL resta =y perche' la sandbox di
# Chrome la richiede, ma i tracer sono spenti.
KERNEL_FRAGMENTS="base.config fragment.config legacy-cpu.config android.config wine.config slim.config"

# --- Immagine -------------------------------------------------------------------
IMAGE_TYPE="dev"
ROOTFS_VERIFICATION="false"
IMAGE_NAME_PATTERN="prismOS_%s_legacy.img"
# Le immagini Slim sono le piu' piccole: niente test, niente debug symbols,
# niente localizzazione estesa.
STRIP_DEBUG="1"
STRIP_LOCALES="1"
KEEP_LOCALES="it_IT.UTF-8 en_US.UTF-8"

# --- Sottosistemi di compatibilita' ----------------------------------------------
# *** on-demand = presente ma spento al boot ***
WAYDROID_BOOT_STATE="on-demand"
WINE_BOOT_STATE="on-demand"
SUBSYSTEM_IDLE_TIMEOUT="120"
SUBSYSTEM_MAX_INSTANCES="1"
SUBSYSTEM_TEARDOWN="aggressive"
SUBSYSTEM_TEARDOWN_GRACE_SEC="3"
# Helper che realizza il contratto di cui sopra.
SLIM_LAUNCHER="/usr/bin/prismos-slim-launcher"
SLIM_LAUNCHER_CONF="/etc/prismos/slim-launcher.conf"
# Soglia di memoria libera sotto la quale il launcher rifiuta di avviare un
# sottosistema e propone l'equivalente web dell'applicazione.
SLIM_LAUNCH_MIN_FREE_MB="256"
SLIM_DROP_CACHES_ON_START="1"
WINE_D3D_BACKEND="wined3d"
WINE_MAX_VRAM_MB="32"
# dex2oat e' limitato a 1 thread e la compilazione AOT delle app Android e'
# disattivata (interpret+JIT) per non saturare i due core disponibili.
WAYDROID_DEX2OAT_THREADS="1"
WAYDROID_COMPILE_FILTER="verify"

# --- Gestione della memoria ----------------------------------------------------------
ZRAM_ENABLED="1"
ZRAM_ALGORITHM="zstd"
ZRAM_SIZE_POLICY="min(max(ram/2, 256), 2048)"
ZSWAP_ENABLED="1"
ZSWAP_COMPRESSOR="zstd"
ZSWAP_MAX_POOL_PERCENT="25"
ZSWAP_WRITEBACK="1"
VM_SWAPPINESS="150"
VM_PAGE_CLUSTER="0"
VFS_CACHE_PRESSURE="200"
VM_DIRTY_RATIO="10"
VM_DIRTY_BACKGROUND_RATIO="3"
EARLYOOM_ENABLED="1"
EARLYOOM_ARGS="-m 8 -s 3 --avoid '^(session_manager|chrome|systemd)$'"
# Trasparent Huge Pages in modalita' madvise: su 1 GB di RAM il defrag
# aggressivo causa stalli di allocazione percepibili.
THP_MODE="madvise"
THP_DEFRAG="madvise"

# --- Dock macOS-like (Ash shelf) ---------------------------------------------------
SHELF_ALIGNMENT="Bottom"
SHELF_AUTOHIDE="Always"
SHELF_CENTERED="true"
SHELF_ICON_SIZE="40"
SHELF_SQUIRCLE_RADIUS="0.28"
SHELF_SQUIRCLE_EXPONENT="5.0"
SHELF_PIN_MAX="6"
SHELF_LAUNCHER_ACCELERATOR="super+space"
SHELF_WEB_SEARCH_ACCELERATOR="super+shift+space"
ICON_THEME="prismOS-Squircle"
# Animazioni e blur disattivati: su Gen5 con 1 GB di RAM il compositore Ash non
# riesce a mantenere i 60 fps con effetti di trasparenza.
SHELF_ANIMATIONS="0"
SHELF_BACKGROUND_BLUR="0"
SHELF_BACKGROUND_OPACITY="1.0"
SHELF_MAX_VISIBLE_WINDOWS="4"

# --- Policy ---------------------------------------------------------------------
POLICY_MODE="none"
POLICY_SOURCE=""
POLICY_TARGET=""
EDU_DOMAIN=""
ENCRYPTED_DOWNLOADS="0"
GUEST_LOGIN_ALLOWED="1"
EPHEMERAL_USERS="0"

# --- Pacchetti ---------------------------------------------------------------------
EXTRA_PACKAGES=""
REMOVED_PACKAGES=""

# --- Albero rootfs dell'edizione -------------------------------------------------------
# Contiene /etc/prismos/slim-tuning.conf, /etc/prismos/slim-launcher.conf,
# /etc/zram-generator.conf e /etc/default/earlyoom.
ROOTFS_FILES="overlays/overlay-prismos-slim/files"

# --- Servizi ------------------------------------------------------------------------
SERVICES_ENABLE="zram-generator earlyoom prismos-dock-apply prismos-accelerator-daemon prismos-firstboot"
SERVICES_DISABLE="prismos-waydroid-container prismos-wine-session@1000 prismos-subsystems.target arc-setup crostini chromeos-printer cups bluetooth"
SERVICES_MASK="prismos-subsystem-idle.timer systemd-timesyncd-backup tracker-miner"

# --- Note operative --------------------------------------------------------------------
NOTES="SLIM mantiene piena compatibilita' con .apk e .exe senza pagarne il costo
al boot: il prezzo e' una latenza di primo avvio di 8-20 secondi ( Waydroid ) o
3-8 secondi ( Wine ). Con meno di 256 MB liberi il launcher rifiuta l'avvio del
sottosistema e propone l'equivalente web presente in profiles/app_pool.json."
