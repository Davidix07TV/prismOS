#!/usr/bin/env bash
# =============================================================================
#  prismOS :: profiles/edu.conf
# -----------------------------------------------------------------------------
#  Profilo di build dell'edizione EDU. Viene caricato con `source` da
#  scripts/build_iso.sh PRIMA di overlays/overlay-prismos-edu/make.conf:
#  dove esiste una variabile PRISMOS_* nel make.conf, quest'ultima vince.
#
#  Le variabili qui definite governano:
#    - identita' dell'edizione e denominazione dell'immagine di output
#    - kernel e splitconfig impiegati
#    - stato di avvio dei sottosistemi Waydroid / Wine
#    - aspetto della Dock (Ash shelf) macOS-like
#    - modalita' di gestione delle policy scolastiche (Strada A / Strada B)
#
#  NON contiene flag USE: quelli risiedono nel make.conf dell'overlay perche'
#  devono essere visti da Portage, non solo dallo script di build.
# =============================================================================

# --- Identita' ----------------------------------------------------------------
PROFILE_ID="edu"
DISPLAY_NAME="prismOS EDU"
EDITION_TAGLINE="Cloud-Managed / Local-Policy - laboratori e aule scolastiche"

# Board ChromiumOS e overlay di riferimento.
BOARD="amd64-prismos"
OVERLAY_DIR="overlays/overlay-prismos-edu"
OVERLAY_COMMON_DIR="overlays/overlay-prismos-common"

# --- Hardware di riferimento ---------------------------------------------------
# Laboratorio scolastico tipo: portatili ricondizionati 2010-2012, CPU dual
# core senza SSE4.2, 2-4 GB di RAM, Intel HD Graphics di prima generazione
# (Ironlake, Gen5: OpenGL 2.1, niente Vulkan, VA-API parziale).
TARGET_CPU="Intel Pentium P6100 (Arrandale) - SSE4.1, no SSE4.2/POPCNT"
MIN_RAM_MB="2048"
TARGET_GPU="Intel HD Graphics (Ironlake/Gen5) - driver crocus + i965"

# --- Kernel --------------------------------------------------------------------
KERNEL_VERSION="6.1"
KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
# Frammenti dello splitconfig sempre applicati; prismos-slim.config NON e'
# incluso in EDU (nessuna compressione aggressiva della memoria).
KERNEL_FRAGMENTS="base.config fragment.config legacy-cpu.config android.config wine.config"

# --- Immagine -------------------------------------------------------------------
# dev  : rootfs scrivibile, ssh abilitato, policy applicabili a runtime
# base : immagine pulita (nessun pacchetto di sviluppo)
IMAGE_TYPE="dev"
# Obbligatoriamente disattivata: prismOS EDU scrive policy e preferenze di Ash
# a runtime (/etc/chromium/policies/managed, Local State) e monta vault cifrati.
ROOTFS_VERIFICATION="false"
# Denominazione del file di output in output/.
IMAGE_NAME_PATTERN="prismOS_%s_legacy.img"

# --- Sottosistemi di compatibilita' ----------------------------------------------
# EDU: Waydroid pronto al boot per le app didattiche Android distribuite fuori
# dal Play Store (sideload di APK verificati); Wine mascherato perche' nei
# laboratori scolastici l'esecuzione di binari Windows non e' presidiata dal DSI.
WAYDROID_BOOT_STATE="enabled"
WINE_BOOT_STATE="masked"
SUBSYSTEM_IDLE_TIMEOUT="600"
SUBSYSTEM_MAX_INSTANCES="1"
SUBSYSTEM_TEARDOWN="graceful"
SUBSYSTEM_TEARDOWN_GRACE_SEC="10"

# --- Dock macOS-like (Ash shelf) ---------------------------------------------------
SHELF_ALIGNMENT="Bottom"
SHELF_AUTOHIDE="Always"
SHELF_CENTERED="true"
SHELF_ICON_SIZE="48"
SHELF_SQUIRCLE_RADIUS="0.28"
SHELF_SQUIRCLE_EXPONENT="5.0"
SHELF_PIN_MAX="8"
SHELF_LAUNCHER_ACCELERATOR="super+space"
SHELF_WEB_SEARCH_ACCELERATOR="super+shift+space"
ICON_THEME="prismOS-Squircle"

# --- Policy scolastiche ---------------------------------------------------------------
# Strada A - Cloud-Managed ("cloud"):
#   nessuna policy JSON locale vincolante; il dispositivo si iscrive alla Google
#   Admin Console dell'istituto grazie ai flag di Enterprise Enrollment scritti
#   in /etc/default/chromium-browser:
#       --enterprise-enable-zero-touch-enrollment
#       --enterprise-enrollment-initial-modulus=<modulo RSA dell'istituto>
#       --enterprise-enrollment-initial-modulus-length=2048
#   Il vincolo di dominio (@scuola.edu) e' espresso dalla policy cloud
#   UserAllowlist / DeviceRestrictionsOnUpgradeTime, non da switch di Chrome.
#
# Strada B - Local-Policy ("local"):
#   build_iso.sh installa overlays/overlay-prismos-edu/chrome_policy.json in
#   /etc/chromium/policies/managed/prismos_policy.json. Le policy di dispositivo
#   hanno precedenza su quelle cloud: il file e' quindi l'unica fonte di verita'
#   finche' non viene rimosso da scripts/set_edu_policy.sh --strada a.
#
# Valori ammessi: local | cloud
POLICY_MODE="local"
POLICY_SOURCE="overlays/overlay-prismos-edu/chrome_policy.json"
POLICY_TARGET="/etc/chromium/policies/managed/prismos_policy.json"
# Dominio istituzionale usato da set_edu_policy.sh per generare la URLAllowlist
# e la UserAllowlist; sovrascrivibile con --domain.
EDU_DOMAIN="scuola.edu"
# URL di servizio dell'istituto sempre raggiungibili anche con URLBlocklist attiva.
EDU_ALLOWLIST_URLS="https://*.${EDU_DOMAIN} https://classroom.google.com https://docs.google.com https://drive.google.com"
# Blocchi della Strada B (distrazione didattica): TikTok, YouTube, Twitch.
EDU_BLOCKLIST_URLS="https://www.tiktok.com https://youtube.com https://www.twitch.tv"
# Modulo RSA iniziale per l'enrollment Zero-Touch della Strada A (vuoto = usare
# il modulo predefinito di ChromeOS). Fornito dal DSI dell'istituto.
EDU_ENROLLMENT_MODULUS=""
EDU_ENROLLMENT_MODULUS_LENGTH="2048"

# --- Sicurezza e privacy ------------------------------------------------------------
# Nessuna crittografia dei Download in EDU: i profili sono effimeri
# (EphemeralUsersEnabled) e i dati restano su Drive.
ENCRYPTED_DOWNLOADS="0"
GUEST_LOGIN_ALLOWED="1"
EPHEMERAL_USERS="1"

# --- Pacchetti ---------------------------------------------------------------------
# Elenco informativo: la lista autoritativa per Portage e'
# PRISMOS_EXTRA_PACKAGES / PRISMOS_REMOVED_PACKAGES nel make.conf dell'overlay.
EXTRA_PACKAGES=""
REMOVED_PACKAGES=""

# --- Albero rootfs dell'edizione -------------------------------------------------------
# Copiato in overlays/overlay-amd64-prismos/board/ da build_iso.sh.
ROOTFS_FILES="overlays/overlay-prismos-edu/files"

# --- Servizi ------------------------------------------------------------------------
SERVICES_ENABLE="prismos-waydroid-container prismos-dock-apply prismos-accelerator-daemon prismos-firstboot"
SERVICES_DISABLE="prismos-wine-session@1000 arc-setup crostini"
SERVICES_MASK="prismos-subsystem-idle.timer"

# --- Note operative --------------------------------------------------------------------
NOTES="EDU privilegia la gestibilita' centralizzata: nessun sottosistema Windows,
Waydroid disponibile per le app didattiche Android, profili effimeri e Dock
bloccata su 8 applicazioni didattiche. Per passare dalla Strada B alla Strada A
in campo usare: scripts/set_edu_policy.sh --strada a --domain istituto.edu"
