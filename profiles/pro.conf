# =============================================================================
#  profiles/pro.conf - prismOS PRO (all-in-one)
# -----------------------------------------------------------------------------
#  Single image, edition chosen at first setup.
#
#  The image ships the configuration templates of the four targeted editions
#  under /usr/share/prismos/editions/<edition>/ and the chooser
#  /usr/libexec/prismos/prismos-edition-setup, run by
#  prismos-edition-setup.service before prismos-firstboot. After the choice the
#  machine is indistinguishable from a native build of that edition.
#
#  Read by: scripts/build_iso.sh (load_edition_profile)
#  Keys are validated by scripts/verify_legacy_cpu.sh --config
# =============================================================================

PROFILE_ID="pro"
DISPLAY_NAME="prismOS Pro"
EDITION_TAGLINE="All-in-one: one image, the edition is chosen at first setup"

BOARD="amd64-prismos"
OVERLAY_DIR="overlays/overlay-prismos-pro"
OVERLAY_COMMON_DIR="overlays/overlay-prismos-common"

# --- hardware target ---------------------------------------------------------
TARGET_CPU="Intel Pentium P6100 (Arrandale) - SSE4.1, no SSE4.2/POPCNT"
MIN_RAM_MB="3072"
TARGET_GPU="Intel HD Graphics (Ironlake/Gen5) - driver crocus + i965"
CRITICAL_RAM_MB="2048"

# --- kernel ------------------------------------------------------------------
KERNEL_VERSION="6.1"
KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
KERNEL_FRAGMENTS="base.config fragment.config legacy-cpu.config android.config wine.config"

# --- image -------------------------------------------------------------------
IMAGE_TYPE="dev"
ROOTFS_VERIFICATION="false"
IMAGE_NAME_PATTERN="prismOS_%s_legacy.img"

STRIP_DEBUG="1"
STRIP_LOCALES="1"
KEEP_LOCALES="it_IT.UTF-8 en_US.UTF-8"

# --- subsystems: off until the setup choice is applied by firstboot ----------
# on-demand keeps every daemon stopped in the window between first boot and
# the setup choice; prismos-firstboot re-applies the state of the chosen
# edition immediately afterwards.
WAYDROID_BOOT_STATE="on-demand"
WINE_BOOT_STATE="on-demand"
SUBSYSTEM_IDLE_TIMEOUT="600"
SUBSYSTEM_MAX_INSTANCES="2"
SUBSYSTEM_TEARDOWN="graceful"
SUBSYSTEM_TEARDOWN_GRACE_SEC="10"

WINE_MAX_VRAM_MB="64"

# --- PRO setup chooser ---------------------------------------------------------
EDITION_CHOOSER="/usr/libexec/prismos/prismos-edition-setup"
EDITION_TEMPLATES_DIR="/usr/share/prismos/editions"
EDITION_CHOICE_STAMP="/var/lib/prismos/state/edition-choice.done"
EDITION_CHOOSER_TIMEOUT_SEC="60"
EDITION_CHOOSER_DEFAULT="home"
EDITION_CHOOSER_CMDLINE_KEY="prismos.edition"

# --- connectivity and security: available, not imposed ------------------------
VPN_ENABLED="1"
VPN_MANAGER="shill"
VPN_BACKENDS="openvpn l2tp-ipsec"
VPN_OPENVPN_TLS_CRYPT="1"
VPN_KILL_SWITCH="0"
VPN_DNS_OVER_TUNNEL="0"
VPN_SPLIT_TUNNEL_ALLOW=""
VPN_EXTRA_CA_DIR=""

ENCRYPTED_DOWNLOADS="1"
VAULT_BACKEND="dm-crypt"
VAULT_PATH="/var/lib/prismos/vaults/downloads.img"
VAULT_MOUNTPOINT="/home/chronos/user/Downloads"
VAULT_SIZE_MB="4096"
VAULT_CIPHER="aes-xts-plain64"
VAULT_KEY_SIZE="256"
VAULT_HASH="sha256"
VAULT_FILESYSTEM="ext4"
VAULT_TPM_SEAL="auto"
VAULT_TPM_PCRS="0,1,7"
VAULT_UNLOCK_MODE="tpm-or-passphrase"
VAULT_IDLE_LOCK_MIN="30"

# --- dock: generous default, tuned again by the chosen edition ---------------
SHELF_ALIGNMENT="Bottom"
SHELF_AUTOHIDE="Always"
SHELF_CENTERED="true"
SHELF_ICON_SIZE="52"
SHELF_SQUIRCLE_RADIUS="0.28"
SHELF_SQUIRCLE_EXPONENT="5.0"
SHELF_PIN_MAX="10"
SHELF_LAUNCHER_ACCELERATOR="super+space"
SHELF_WEB_SEARCH_ACCELERATOR="super+shift+space"
ICON_THEME="prismOS-Squircle"
SHELF_ANIMATIONS="1"
SHELF_BACKGROUND_BLUR="1"
SHELF_BACKGROUND_OPACITY="0.86"
SHELF_MAX_VISIBLE_WINDOWS="8"

# --- policy: templates only, the active one comes from the chosen edition ----
POLICY_MODE="template"
POLICY_SOURCE=""
POLICY_TARGET=""
EDU_DOMAIN=""

DOWNLOAD_DEFAULT_DIRECTORY="/home/chronos/user/Downloads"

KERBEROS_ENABLED="0"
KERBEROS_REALM=""
KERBEROS_KEEP_TICKET="1"
AUDIT_LOG_ENABLED="0"
AUDIT_LOG_PATH="/var/log/prismos/audit.log"
AUDIT_LOG_RETENTION_DAYS="90"

SCREEN_LOCK_TIMEOUT_SEC="600"
SCREEN_LOCK_ON_START="0"

# --- packages ------------------------------------------------------------------
EXTRA_PACKAGES=""
REMOVED_PACKAGES=""

ROOTFS_FILES="overlays/overlay-prismos-pro/files"

SERVICES_ENABLE="prismos-edition-setup prismos-dock-apply prismos-accelerator-daemon prismos-firstboot"
SERVICES_DISABLE="prismos-waydroid-container arc-setup"
SERVICES_MASK=""

NOTES="PRO is the all-in-one image: every targeted capability is compiled in and
the edition is selected at first setup (kernel cmdline prismos.edition=,
preseed file /etc/prismos/edition-choice, or interactive console prompt).
Slim-like compile-time reductions (zram, direct ALSA, no PipeWire) are NOT
part of PRO: choose the slim edition at setup only for its runtime behaviour,
or build a native slim image for machines under 2 GB of RAM."
