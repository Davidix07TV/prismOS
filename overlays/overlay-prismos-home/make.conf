# =============================================================================
#  prismOS :: overlay-prismos-home :: make.conf
# -----------------------------------------------------------------------------
#  Edizione HOME: intrattenimento, streaming multimediale e gaming leggero.
#  Concatenata dopo overlay-prismos-common/make.conf da scripts/build_iso.sh.
# =============================================================================

PRISMOS_EDITION_ID="home"
PRISMOS_EDITION_NAME="prismOS Home"
PRISMOS_EDITION_TAGLINE="Entertainment, streaming & light gaming edition"

# -----------------------------------------------------------------------------
# USE specifici HOME
# -----------------------------------------------------------------------------
# media-stack      : ffmpeg completo, dav1d, libplacebo-less (niente Vulkan),
#                    PulseAudio/PipeWire, codec proprietari widevine+h264+aac
# cloud-gaming     : ottimizzazioni di rete per GeForce NOW / Xbox Cloud
#                    (BBR, TCP window scaling, low-latency qdisc fq_codel)
# android-gaming   : Waydroid attivo all'avvio con profilo GPU "host" e
#                    input mapping per gamepad (xboxdrv/evdev)
# windows-gaming   : Wine + Proton attivi, prefix pre-inizializzato in
#                    /home/chronos/user/WineBottles/Default
# drm-l3           : Widevine L3 (unico livello ottenibile senza TEE): 720p su
#                    Netflix, sufficiente per pannelli legacy 1366x768
USE="${USE} media-stack cloud-gaming android-gaming windows-gaming drm-l3 \
waydroid wine proton bottles gstreamer pipewire pulseaudio \
-crostini -device-restrict -kiosk-exam"

PRISMOS_EDITION="prismos_edition_home"

PRISMOS_POLICY_SOURCE=""
PRISMOS_POLICY_TARGET=""
PRISMOS_ROOTFS_FILES="overlays/overlay-prismos-home/files"

PRISMOS_EXTRA_PACKAGES="
app-emulation/bottles
app-emulation/winetricks
app-emulation/dxvk
app-emulation/vkd3d-proton
media-video/ffmpeg
media-sound/pipewire
games-util/xboxdrv
net-misc/iperf
"

PRISMOS_REMOVED_PACKAGES="
app-admin/chromeos-policy-tool
chromeos-base/prismos-edu-enrollment
"

# Home: entrambi i sottosistemi partono al boot (esperienza "sempre pronta"),
# con idle-timeout di 900 s che li sospende se inutilizzati.
PRISMOS_WAYDROID_BOOT_STATE="enabled"
PRISMOS_WINE_BOOT_STATE="enabled"
PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE="enabled"
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="900"

PRISMOS_SHELF_PIN_MAX="10"
PRISMOS_SHELF_AUTOHIDE="Always"
PRISMOS_SHELF_ALIGNMENT="Bottom"

export PRISMOS_EDITION_ID PRISMOS_EDITION_NAME PRISMOS_EDITION_TAGLINE
export PRISMOS_POLICY_SOURCE PRISMOS_POLICY_TARGET PRISMOS_ROOTFS_FILES
export PRISMOS_EXTRA_PACKAGES PRISMOS_REMOVED_PACKAGES
export PRISMOS_WAYDROID_BOOT_STATE PRISMOS_WINE_BOOT_STATE
export PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE PRISMOS_SUBSYSTEM_IDLE_TIMEOUT
export PRISMOS_SHELF_PIN_MAX PRISMOS_SHELF_AUTOHIDE PRISMOS_SHELF_ALIGNMENT
