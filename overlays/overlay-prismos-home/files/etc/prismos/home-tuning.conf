# =============================================================================
#  /etc/prismos/home-tuning.conf   -   prismOS Home
# -----------------------------------------------------------------------------
#  Tuning per intrattenimento, streaming multimediale e gaming leggero.
#  Letto da /usr/libexec/prismos/prismos-firstboot.
# =============================================================================

# --- Sottosistemi -------------------------------------------------------------
# Home tiene Waydroid e Wine attivi all'avvio: l'utente si aspetta che un .apk o
# un .exe si aprano subito, senza i 40-70 s di avvio del container.
PRISMOS_WAYDROID_BOOT_STATE="enabled"
PRISMOS_WINE_BOOT_STATE="enabled"
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="900"
PRISMOS_SUBSYSTEM_MAX_INSTANCES="2"

# --- Streaming ------------------------------------------------------------------
# Priorita' ai processi audio/video: evita scatti quando il container Android o
# un processo Wine occupa la CPU in background.
PRISMOS_MEDIA_NICE="-5"
PRISMOS_AUDIO_REALTIME="1"
PRISMOS_GPU_SCHED_PRIORITY="high"
# Buffer di rete piu' ampio per lo streaming adattivo (Netflix/GeForce NOW).
PRISMOS_NET_TCP_RMEM="4096 262144 6291456"
PRISMOS_NET_TCP_WMEM="4096 131072 6291456"
PRISMOS_NET_QDISC="fq_codel"

# --- Gaming -----------------------------------------------------------------------
# wined3d su Intel HD Graphics Gen5: niente Vulkan, quindi niente DXVK.
PRISMOS_WINE_D3D_BACKEND="wined3d"
PRISMOS_WINE_VIDEO_MEMORY_MB="64"
PRISMOS_WINE_MAX_SHADER_MODEL="3"
PRISMOS_GAMEPAD_ENABLED="1"
PRISMOS_GAMEPAD_DRIVER="xpad"
# GeForce NOW e' una web app: la qualita' massima sensata su 1366x768 e 2 core.
PRISMOS_CLOUD_GAMING_RESOLUTION="1280x720"
PRISMOS_CLOUD_GAMING_FPS="60"

# --- DRM / codec --------------------------------------------------------------------
PRISMOS_WIDEVINE_LEVEL="L3"
PRISMOS_MAX_STREAM_RESOLUTION="720p"
PRISMOS_CODEC_PREFERENCE="vp9,h264,av1"
PRISMOS_HW_VIDEO_DECODE="mpeg2,vc1"
