# =============================================================================
#  /etc/prismos/work.conf   -   prismOS Work
# -----------------------------------------------------------------------------
#  Produttivita' aziendale: Microsoft 365, VPN avanzata, Download crittografati.
# =============================================================================

# --- Sottosistemi ---------------------------------------------------------------
PRISMOS_WAYDROID_BOOT_STATE="on-demand"
PRISMOS_WINE_BOOT_STATE="enabled"
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="300"
PRISMOS_SUBSYSTEM_MAX_INSTANCES="1"

# --- Microsoft 365 ----------------------------------------------------------------
PRISMOS_M365_TENANT=""
PRISMOS_M365_DOMAIN=""
PRISMOS_M365_PINNED_APPS="microsoft-365,outlook,zoom,slack,vscode-web,google-drive"
PRISMOS_M365_SSO_MODE="gaia"
PRISMOS_M365_OFFLINE_CACHE_MB="512"

# --- VPN avanzata --------------------------------------------------------------------
# shill e' lo stack di rete di ChromeOS: supporta nativamente OpenVPN,
# L2TP/IPsec e IKEv2. I profili vengono importati da /etc/prismos/vpn/.
PRISMOS_VPN_ENABLED="1"
PRISMOS_VPN_PROVIDER="openvpn"
PRISMOS_VPN_ALWAYS_ON="0"
PRISMOS_VPN_CONFIG_DIR="/etc/prismos/vpn"
PRISMOS_VPN_OPENVPN_CIPHER="AES-256-GCM"
PRISMOS_VPN_OPENVPN_AUTH="SHA256"
PRISMOS_VPN_TLS_CRYPT="1"
PRISMOS_VPN_PKCS11_MODULE="/usr/lib64/pkcs11/opensc-pkcs11.so"
PRISMOS_VPN_DNS_OVER_TLS="1"
PRISMOS_VPN_KILL_SWITCH="1"

# --- Cartella Download crittografata ---------------------------------------------------
# Volume dm-crypt/LUKS su file loopback, montato in ~/Downloads. La chiave e'
# derivata dalla password dell'utente tramite il vault di cryptohome e, quando
# il TPM 1.2 delle macchine Arrandale e' utilizzabile, sigillata nel TPM.
PRISMOS_ENCRYPTED_DOWNLOADS="1"
PRISMOS_ENCRYPTED_DOWNLOADS_MOUNT="/home/chronos/user/Downloads"
PRISMOS_ENCRYPTED_DOWNLOADS_IMAGE="/var/lib/prismos/vaults/downloads.img"
PRISMOS_ENCRYPTED_DOWNLOADS_SIZE_MB="4096"
PRISMOS_ENCRYPTED_DOWNLOADS_CIPHER="aes-xts-plain64"
PRISMOS_ENCRYPTED_DOWNLOADS_KEYSIZE="256"
PRISMOS_ENCRYPTED_DOWNLOADS_HASH="sha256"
PRISMOS_ENCRYPTED_DOWNLOADS_TPM_SEAL="auto"
PRISMOS_ENCRYPTED_DOWNLOADS_AUTOMOUNT="1"
PRISMOS_ENCRYPTED_DOWNLOADS_IDLE_UNMOUNT_SEC="900"

# --- Sicurezza -------------------------------------------------------------------------
PRISMOS_SCREENSHOT_ALLOWED="1"
PRISMOS_DEVTOOLS_ALLOWED="1"
PRISMOS_AUDIT_LOGGING="1"
PRISMOS_AUDIT_LOG_PATH="/var/log/prismos/audit.log"
PRISMOS_AUDIT_LOG_RETENTION_DAYS="90"
PRISMOS_SCREEN_LOCK_TIMEOUT_SEC="300"
PRISMOS_POWERWASH_ON_SIGNOUT="0"
PRISMOS_GUEST_LOGIN="0"
PRISMOS_KERBEROS_ENABLED="1"
PRISMOS_KERBEROS_REALM=""
