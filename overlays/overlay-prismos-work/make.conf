# =============================================================================
#  prismOS :: overlay-prismos-work :: make.conf
# -----------------------------------------------------------------------------
#  Edizione WORK: produttivita' aziendale, Microsoft 365, VPN avanzato e
#  cartella Download crittografata.
#  Concatenata dopo overlay-prismos-common/make.conf da scripts/build_iso.sh.
# =============================================================================

PRISMOS_EDITION_ID="work"
PRISMOS_EDITION_NAME="prismOS Work"
PRISMOS_EDITION_TAGLINE="Business productivity & secure remote-work edition"

# -----------------------------------------------------------------------------
# USE specifici WORK
# -----------------------------------------------------------------------------
# m365-suite       : pin nella shelf di Outlook Web, Office.com, Teams Web e
#                    OneDrive; ManagedBookmarks aziendali; Single Sign-On via
#                    GAIA con dominio tenant vincolato
# vpn-advanced     : shill con backend OpenVPN (tls-crypt, PKCS#11),
#                    L2TP/IPsec + IKEv2/strongSwan, Always-On VPN tramite
#                    policy DeviceOpenVpn* e NetworkHosts
# encrypted-dl     : cartella ~/Downloads montata come volume dm-crypt/LUKS
#                    dedicato (loopback su file sparse, chiave derivata dalla
#                    password dell'utente via cryptohome vault)
# kerberos         : ticket AD per SSO su share SMB e applicativi enterprise
# tpm2-seal        : sigillo della chiave LUKS nel TPM 1.2/2.0 quando presente
#                    (Arrandale monta tipicamente un TPM 1.2 Infineon SLB9635)
# audit-logging    : journal persistente su /var/log/prismos con rotazione
USE="${USE} m365-suite vpn-advanced encrypted-dl kerberos tpm2-seal audit-logging \
waydroid wine proton bottles crostini virtio-gpu \
-device-restrict -kiosk-exam -school-lab -cloud-gaming"

PRISMOS_EDITION="prismos_edition_work"

PRISMOS_POLICY_SOURCE="overlays/overlay-prismos-work/files/etc/chromium/policies/managed/prismos_policy.json"
PRISMOS_POLICY_TARGET="/etc/chromium/policies/managed/prismos_policy.json"
PRISMOS_ROOTFS_FILES="overlays/overlay-prismos-work/files"

PRISMOS_EXTRA_PACKAGES="
app-crypt/gnupg
app-crypt/pinentry
sys-fs/cryptsetup
sys-fs/dmsetup
net-vpn/openvpn
net-vpn/strongswan
net-vpn/networkmanager-openconnect
app-crypt/tpm2-tools
app-admin/sudo
dev-vcs/git
"

PRISMOS_REMOVED_PACKAGES="
games-util/xboxdrv
net-misc/iperf
"

# Work: Wine sempre disponibile (installer MSI aziendali, gestionali Win32),
# Waydroid avviato on-demand con idle-timeout aggressivo (300 s).
PRISMOS_WAYDROID_BOOT_STATE="on-demand"
PRISMOS_WINE_BOOT_STATE="enabled"
PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE="enabled"
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="300"

# Crittografia della cartella Download.
PRISMOS_ENCRYPTED_DOWNLOADS="1"
PRISMOS_ENCRYPTED_DOWNLOADS_MOUNT="/home/chronos/user/Downloads"
PRISMOS_ENCRYPTED_DOWNLOADS_CIPHER="aes-xts-plain64"
PRISMOS_ENCRYPTED_DOWNLOADS_KEYSIZE="256"
PRISMOS_ENCRYPTED_DOWNLOADS_SIZE_MB="4096"

PRISMOS_SHELF_PIN_MAX="8"
PRISMOS_SHELF_AUTOHIDE="Always"
PRISMOS_SHELF_ALIGNMENT="Bottom"

export PRISMOS_EDITION_ID PRISMOS_EDITION_NAME PRISMOS_EDITION_TAGLINE
export PRISMOS_POLICY_SOURCE PRISMOS_POLICY_TARGET PRISMOS_ROOTFS_FILES
export PRISMOS_EXTRA_PACKAGES PRISMOS_REMOVED_PACKAGES
export PRISMOS_WAYDROID_BOOT_STATE PRISMOS_WINE_BOOT_STATE
export PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE PRISMOS_SUBSYSTEM_IDLE_TIMEOUT
export PRISMOS_ENCRYPTED_DOWNLOADS PRISMOS_ENCRYPTED_DOWNLOADS_MOUNT
export PRISMOS_ENCRYPTED_DOWNLOADS_CIPHER PRISMOS_ENCRYPTED_DOWNLOADS_KEYSIZE
export PRISMOS_ENCRYPTED_DOWNLOADS_SIZE_MB
export PRISMOS_SHELF_PIN_MAX PRISMOS_SHELF_AUTOHIDE PRISMOS_SHELF_ALIGNMENT
