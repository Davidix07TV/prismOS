# =============================================================================
#  prismOS :: overlay-prismos-edu :: make.conf
# -----------------------------------------------------------------------------
#  Variabili Portage specifiche dell'edizione EDU. Questo file viene
#  CONCATENATO (non sourcato) dopo overlay-prismos-common/make.conf da
#  scripts/build_iso.sh per produrre:
#      $CROS_SDK/src/overlays/overlay-amd64-prismos/make.conf
#
#  Ordine di concatenazione: common (floor ISA) -> edition (USE) -> board.
#  Le variabili definite qui sovrascrivono quelle del profilo comune.
# =============================================================================

PRISMOS_EDITION_ID="edu"
PRISMOS_EDITION_NAME="prismOS EDU"
PRISMOS_EDITION_TAGLINE="Cloud-Managed & Local-Policy school edition"

# -----------------------------------------------------------------------------
# USE specifici EDU
# -----------------------------------------------------------------------------
# cloud-enrollment : Strada A. Predisposizione Zero-Touch/Forced Re-Enrollment
#                    con dominio istituzionale *.edu gestito da Google Admin.
# local-policy     : Strada B. Policy JSON offline in
#                    /etc/chromium/policies/managed/prismos_policy.json
# kiosk-exam       : modalita' esame (KioskAppToLaunch + single-app)
# school-lab       : preset di laboratorio: guest login, restore on reboot
# device-restrict  : blocco USB storage, screenshot, stampa non presidiata
#
# Crostini e' disattivato nei laboratori scolastici (nessun container Linux
# gestibile dal DSI); Waydroid resta disponibile per le app didattiche
# Android distribuite fuori dal Play Store (sideload APK verificati).
USE="${USE} cloud-enrollment local-policy kiosk-exam school-lab device-restrict \
waydroid wine -proton -bottles -crostini -virtio-gpu -developer-tools"

PRISMOS_EDITION="prismos_edition_edu"

# -----------------------------------------------------------------------------
# Policy di default inclusa nell'immagine
# -----------------------------------------------------------------------------
# Percorso relativo alla radice della repository; build_iso.sh lo copia in
#   $CROS_SDK/src/overlays/overlay-amd64-prismos/board/etc/chromium/policies/managed/prismos_policy.json
PRISMOS_POLICY_SOURCE="overlays/overlay-prismos-edu/chrome_policy.json"
PRISMOS_POLICY_TARGET="/etc/chromium/policies/managed/prismos_policy.json"

# File radice dell'edizione (albero rootfs speculare) copiato in board/ dal
# sync_overlays.sh: contiene /etc/prismos/edition.conf e i template di
# /etc/default/chromium-browser per la Strada A.
PRISMOS_ROOTFS_FILES="overlays/overlay-prismos-edu/files"

# -----------------------------------------------------------------------------
# Pacchetto aggiuntivi / rimossi rispetto al @system comune
# -----------------------------------------------------------------------------
PRISMOS_EXTRA_PACKAGES="
chromeos-base/prismos-edu-enrollment
app-admin/chromeos-policy-tool
net-misc/curl
app-crypt/gnupg
"

PRISMOS_REMOVED_PACKAGES="
app-emulation/bottles
chromeos-base/crostini-arc
dev-util/perf
"

# -----------------------------------------------------------------------------
# Avvio dei sottosistemi (EDU: Waydroid pronto, Wine spento)
# -----------------------------------------------------------------------------
PRISMOS_WAYDROID_BOOT_STATE="enabled"
PRISMOS_WINE_BOOT_STATE="masked"
PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE="enabled"

# Shelf/Dock: 8 pin massimi per mantenere la dock leggibile su schermi 1366x768.
PRISMOS_SHELF_PIN_MAX="8"
PRISMOS_SHELF_AUTOHIDE="Always"
PRISMOS_SHELF_ALIGNMENT="Bottom"

export PRISMOS_EDITION_ID PRISMOS_EDITION_NAME PRISMOS_EDITION_TAGLINE
export PRISMOS_POLICY_SOURCE PRISMOS_POLICY_TARGET PRISMOS_ROOTFS_FILES
export PRISMOS_EXTRA_PACKAGES PRISMOS_REMOVED_PACKAGES
export PRISMOS_WAYDROID_BOOT_STATE PRISMOS_WINE_BOOT_STATE
export PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE
export PRISMOS_SHELF_PIN_MAX PRISMOS_SHELF_AUTOHIDE PRISMOS_SHELF_ALIGNMENT
