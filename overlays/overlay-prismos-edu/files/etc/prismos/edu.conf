# =============================================================================
#  /etc/prismos/edu.conf   -   prismOS EDU
# -----------------------------------------------------------------------------
#  Parametri di gestione scolastica. Vengono letti da set_edu_policy.sh (per
#  rigenerare la policy locale) e da prismos-firstboot (per decidere se il
#  dispositivo opera in Strada A o Strada B).
# =============================================================================
PRISMOS_EDU_MODE="cloud"
PRISMOS_EDU_DOMAIN="scuola.edu"
PRISMOS_EDU_INSTITUTE_NAME="Istituto Comprensivo Statale"
PRISMOS_EDU_ADMIN_EMAIL="dsga@scuola.edu"
PRISMOS_EDU_OU_PATH="/Dispositivi/Laboratori"
PRISMOS_EDU_AUTO_ENROLLMENT="1"
PRISMOS_EDU_POWERWASH_ON_SIGNOUT="1"
PRISMOS_EDU_GUEST_LOGIN="0"
PRISMOS_EDU_LOCAL_POLICY="/etc/chromium/policies/managed/prismos_policy.json"
PRISMOS_EDU_POLICY_TEMPLATE="/usr/share/prismos/chrome_policy.json"
PRISMOS_EDU_URL_BLOCK_EXTRA=""
PRISMOS_EDU_URL_ALLOW_EXTRA=""
PRISMOS_EDU_EXAM_MODE="0"
PRISMOS_EDU_EXAM_APP_URL=""
PRISMOS_WAYDROID_ALLOWED="1"
PRISMOS_WINE_ALLOWED="0"
PRISMOS_CROSTINI_ALLOWED="0"
PRISMOS_SCREENSHOT_ALLOWED="0"
PRISMOS_PRINTING_ALLOWED="1"
