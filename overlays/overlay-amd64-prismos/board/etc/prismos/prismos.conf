# =============================================================================
#  /etc/prismos/prismos.conf   (board amd64-prismos)
# -----------------------------------------------------------------------------
#  Identita' statica della distribuzione, presente in tutte le edizioni.
#  I valori specifici dell'edizione vivono in /etc/prismos/edition.conf,
#  generato da scripts/build_iso.sh al momento della creazione dell'immagine.
# =============================================================================
PRISMOS_NAME="prismOS"
PRISMOS_CODENAME="Legacy Prism"
PRISMOS_VERSION="1.0.0"
PRISMOS_BOARD="amd64-prismos"
PRISMOS_BASE="ChromiumOS (openFyde-derived Portage tree, senza ARC/ARC++)"
PRISMOS_ISA_FLOOR="x86_64-SSE4.1"
PRISMOS_ISA_DENY="sse4.2,popcnt,avx,avx2,aes,pclmul"
PRISMOS_TARGET_CPU="Intel Pentium P6100 / Celeron P4500 (Arrandale)"
PRISMOS_TARGET_GPU="Intel HD Graphics 1st gen (Ironlake, Gen5, 8086:0046)"
PRISMOS_MIN_RAM_MB="1024"
PRISMOS_KERNEL="chromeos-kernel-6.1 splitconfig chromiumos-x86_64/prismos_legacy"
PRISMOS_SUBSYSTEM_ANDROID="waydroid (LineageOS 16.0 x86, Android 9 API 28)"
PRISMOS_SUBSYSTEM_WINDOWS="wine-staging + proton (wined3d)"
PRISMOS_SUBSYSTEM_ARC="removed (richiede SSE4.2/POPCNT)"
PRISMOS_DOCK_STYLE="macos-like: Bottom, centered, autohide Always, squircle r=0.28"
PRISMOS_LAUNCHER_ACCELERATOR="super+space"
PRISMOS_HOMEPAGE="https://github.com/Davidix07TV/prismOS"
PRISMOS_SUPPORT="https://github.com/Davidix07TV/prismOS/issues"
