# =============================================================================
#  Board amd64-prismos :: make.conf
# -----------------------------------------------------------------------------
#  ATTENZIONE: questo file e' la PARTE FINALE del make.conf di board. Durante la
#  build scripts/build_iso.sh genera
#      $CROS_SDK/src/overlays/overlay-amd64-prismos/make.conf
#  concatenando, nell'ordine:
#      1. overlays/overlay-prismos-common/make.conf   (floor ISA, GPU, GN args)
#      2. overlays/overlay-prismos-<edizione>/make.conf  (USE di edizione)
#      3. questo file                                 (identita' del board)
#  Le variabili di questo file hanno quindi la precedenza su tutte le altre.
# =============================================================================

# --- Identita' del board --------------------------------------------------------
BOARD="amd64-prismos"
PRISMOS_BOARD="${BOARD}"
CHOST="x86_64-cros-linux-gnu"
CBUILD="${CHOST}"
CTARGET="${CHOST}"

# Profilo Portage del board (creato da setup_board --board=amd64-prismos).
PORTAGE_PROFILE="default/linux/amd64/10.0/chromeos"

# --- Kernel -----------------------------------------------------------------------
# Splitconfig prismOS dentro chromeos/config/ del kernel ChromeOS: contiene i
# frammenti per binder/binderfs (Waydroid), binfmt_misc (Wine), zram (Slim) e le
# disattivazioni delle ottimizzazioni ISA non disponibili.
CHROMEOS_KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
CHROMEOS_KERNEL_VERSION="6.1"

# --- Firmware / boot ---------------------------------------------------------------
# Le macchine target (2010-2012) hanno firmware coreboot/Legacy BIOS oppure UEFI
# con CSM. Si generano entrambe le immagini.
PRISMOS_BOOTLOADER="grub"
PRISMOS_UEFI_SUPPORT="1"
PRISMOS_LEGACY_BIOS_SUPPORT="1"

# --- Costruzione dell'immagine -------------------------------------------------------
# dev = immagine con dev_install (shell di sviluppo, sudo, pacchetto di test).
# base = immagine di produzione firmata, senza shell root.
PRISMOS_IMAGE_TYPE="dev"
PRISMOS_IMAGE_NAME_TEMPLATE="prismOS_[EDITION]_legacy.img"

# Rootfs verification: disattivata per le immagini dev per permettere la
# modifica di /etc/chromium/policies/managed in fase di provisioning scolastico.
PRISMOS_ROOTFS_VERIFICATION="false"

# --- Sottosistemi -------------------------------------------------------------------
# ARC/ARC++/ARCVM esclusi a livello di board: anche se un pacchetto li tirasse
# dentro come dipendenza debole, l'USE negativo del board li disattiva.
#
# *** ORDINE DI PRECEDENZA ***
# scripts/build_iso.sh concatena i make.conf nell'ordine
#     common  ->  <edizione>  ->  board
# e Portage applica la SEMANTICA "ultimo valore visto vince". Questo file e'
# quindi l'ultimo: qui vanno dichiarati SOLO i vincoli che devono valere per
# tutte le edizioni senza eccezioni (la rimozione di ARC). Le USE positive
# (waydroid, wine, proton, vaapi, widevine, h264, ...) sono gia' impostate da
# overlay-prismos-common/make.conf e vengono eventualmente negate dalle singole
# edizioni (es. EDU usa -proton, Slim usa -media-stack): ribadirle qui le
# riattiverebbe indebitamente.
USE="${USE} -arc -arc-plus -arcplusplus -arcvm"

# --- Vincoli di memoria del target ----------------------------------------------------
# Prefisso BOARD_: sono i requisiti MINIMI del board (validi per ogni edizione).
# I profili di edizione dichiarano il proprio PRISMOS_MIN_RAM_MB in
# profiles/<edizione>.conf e possono alzarlo (EDU/HOME/WORK = 2048/3072 MiB,
# SLIM = 1024 MiB); build_iso.sh usa il valore del profilo, non questo.
PRISMOS_BOARD_MIN_RAM_MB="1024"
PRISMOS_BOARD_RECOMMENDED_RAM_MB="2048"
PRISMOS_BOARD_MIN_DISK_MB="8192"
PRISMOS_TARGET_CPU="Intel Pentium P6100 (Arrandale, SSE4.1 max)"

export BOARD PRISMOS_BOARD CHROMEOS_KERNEL_SPLITCONFIG CHROMEOS_KERNEL_VERSION
export PRISMOS_IMAGE_TYPE PRISMOS_IMAGE_NAME_TEMPLATE PRISMOS_ROOTFS_VERIFICATION
export PRISMOS_BOOTLOADER PRISMOS_UEFI_SUPPORT PRISMOS_LEGACY_BIOS_SUPPORT
export PRISMOS_BOARD_MIN_RAM_MB PRISMOS_BOARD_RECOMMENDED_RAM_MB
export PRISMOS_BOARD_MIN_DISK_MB
export PRISMOS_TARGET_CPU PORTAGE_PROFILE
