# =============================================================================
#  overlay-prismos-pro/make.conf
# -----------------------------------------------------------------------------
#  All-in-one edition: union of the positive USE flags of the four targeted
#  editions, minus what conflicts with a generalist destination. The edition
#  is chosen at first setup by prismos-edition-setup, therefore this profile
#  must keep every subsystem AVAILABLE and let runtime configuration decide.
#
#  Concatenation order (see docs/architecture.md section 2.1):
#    1. overlay-prismos-common/make.conf   2. THIS FILE   3. board make.conf
#  This file must never re-enable a USE negated by the common floor.
# =============================================================================

PRISMOS_EDITION_ID="pro"
PRISMOS_EDITION_NAME="prismOS Pro"
PRISMOS_EDITION_TAGLINE="All-in-one: one image, the edition is chosen at first setup"

# --- USE di edizione -----------------------------------------------------------
# all-in-one         : marker consumed by prismos-runtime-config
# edition-chooser    : installs prismos-edition-setup and its unit
# everything else    : union of edu/home/work positive flags
USE="${USE} prismos_edition_pro all-in-one edition-chooser \
media-stack cloud-gaming android-gaming windows-gaming drm-l3 \
m365-suite vpn-advanced encrypted-dl kerberos tpm2-seal audit-logging \
waydroid wine proton bottles crostini virtio-gpu \
gstreamer pipewire pulseaudio vaapi widevine h264 aac mp3 proprietary-codecs \
zswap earlyoom \
-device-restrict -kiosk-exam -school-lab -slim-ondemand -low-ram -no-extras"

PRISMOS_EDITION="prismos_edition_pro"

# --- policy: no active device policy at build time ------------------------------
# The active policy (EDU Route B or Work) is installed at first setup from the
# templates shipped under /usr/share/prismos/editions/<edition>/.
PRISMOS_POLICY_SOURCE=""
PRISMOS_POLICY_TARGET=""

PRISMOS_ROOTFS_FILES="overlays/overlay-prismos-pro/files"

# --- additional packages ---------------------------------------------------------
PRISMOS_EXTRA_PACKAGES="
app-emulation/bottles
app-crypt/gnupg
app-crypt/tpm2-tools
net-vpn/openvpn
net-vpn/strongswan
sys-fs/cryptsetup
"

PRISMOS_REMOVED_PACKAGES=""
