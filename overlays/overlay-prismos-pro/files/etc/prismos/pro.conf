# =============================================================================
#  /etc/prismos/pro.conf - runtime tuning of the PRO image BEFORE the choice
# -----------------------------------------------------------------------------
#  These values govern the narrow window between first boot and the edition
#  selection performed by prismos-edition-setup. As soon as the choice is
#  applied, /etc/prismos/edition.conf is replaced by the template of the
#  chosen edition and this file becomes inert reference documentation.
# =============================================================================

# Keep the session light until the choice: no subsystem daemon is running.
PRO_PRE_CHOICE_MODE="quiet"

# Console used by the interactive chooser when no cmdline/preseed is present.
PRO_CHOOSER_CONSOLE="/dev/console"

# Banner shown by the chooser on the console.
PRO_CHOOSER_BANNER="prismOS Pro - choose the edition for this machine"

# Seconds granted to the operator before falling back to the default edition.
PRO_CHOOSER_TIMEOUT_SEC="60"

# Fallback edition when the timeout expires or no console is available.
PRO_CHOOSER_DEFAULT="home"

# Kernel command line key honoured for unattended installations.
PRO_CHOOSER_CMDLINE_KEY="prismos.edition"

# Preseed file honoured when present (written by installers/imaging tools).
PRO_CHOOSER_PRESEED="/etc/prismos/edition-choice"

# Where the templates of the four editions live inside the image.
PRO_EDITION_TEMPLATES="/usr/share/prismos/editions"

# Stamp preventing the chooser from running twice.
PRO_CHOICE_STAMP="/var/lib/prismos/state/edition-choice.done"
