# =============================================================================
#  prismOS :: overlay-prismos-slim :: make.conf
# -----------------------------------------------------------------------------
#  Edizione SLIM: ultra-leggera per PC con risorse critiche o < 2 GB di RAM.
#  Il supporto a Waydroid e Wine e' INSTALLATO ma COMPLETAMENTE SPENTO al boot.
#  I demoni e i container vengono attivati on-demand da
#  /usr/bin/prismos-slim-launcher all'apertura di un file .apk o .exe e
#  terminati (SIGTERM -> SIGKILL) alla chiusura dell'applicazione.
#
#  Concatenata dopo overlay-prismos-common/make.conf da scripts/build_iso.sh.
# =============================================================================

PRISMOS_EDITION_ID="slim"
PRISMOS_EDITION_NAME="prismOS Slim"
PRISMOS_EDITION_TAGLINE="Sub-2GB on-demand subsystem edition"

# -----------------------------------------------------------------------------
# USE specifici SLIM
# -----------------------------------------------------------------------------
# slim-ondemand    : *** INTERRUTTORE PRINCIPALE ***
#                    1. compila e installa app-misc/prismos-slim-launcher
#                       (helper /usr/bin/prismos-slim-launcher)
#                    2. installa le drop-in systemd che rendono i sottosistemi
#                       `WantedBy=` vuoto (nessun target li trascina al boot)
#                    3. converte le unita' in Type=notify + RemainAfterExit=no
#                       con ExecStopPost di pulizia dei mount e dei cgroup
# low-ram          : zram 50% con algoritmo zstd, zswap writeback, vm.swappiness
#                    150, earlyoom con soglia 8%/3%, disattivazione di
#                    prefetch/caching aggressivo di Ash
# no-extras        : niente Bottles (frontend GTK+Python ~180 MB), niente
#                    Crostini, niente stampanti, niente indicizzazione file
# single-thread-link : -j1 sul link dei pacchetti piu' pesanti per evitare OOM
#                    del build host su macchine con 2 GB
USE="${USE} slim-ondemand low-ram no-extras single-thread-link \
waydroid wine proton zram zswap earlyoom \
-bottles -crostini -virtio-gpu -cloud-gaming -media-stack \
-pipewire -pulseaudio -cups -bluetooth-printers \
-kiosk-exam -school-lab -m365-suite -vpn-advanced -encrypted-dl"

PRISMOS_EDITION="prismos_edition_slim"

PRISMOS_POLICY_SOURCE=""
PRISMOS_POLICY_TARGET=""
PRISMOS_ROOTFS_FILES="overlays/overlay-prismos-slim/files"

PRISMOS_EXTRA_PACKAGES="
app-misc/prismos-slim-launcher
sys-process/earlyoom
sys-block/zram-generator
app-arch/zstd
"

PRISMOS_REMOVED_PACKAGES="
app-emulation/bottles
app-emulation/vkd3d-proton
app-emulation/dxvk
chromeos-base/crostini-arc
media-sound/pipewire
net-print/cups
games-util/xboxdrv
dev-util/perf
"

# -----------------------------------------------------------------------------
# STATO DI AVVIO DEI SOTTOSISTEMI (SLIM = TUTTO SPENTO)
# -----------------------------------------------------------------------------
# Valori ammessi da build_iso.sh -> systemctl preset:
#   enabled   : parte al boot
#   on-demand : non parte al boot, viene attivato da prismos-slim-launcher
#   disabled  : non parte al boot, attivabile manualmente
#   masked    : symlink a /dev/null, non avviabile nemmeno a mano
PRISMOS_WAYDROID_BOOT_STATE="on-demand"
PRISMOS_WINE_BOOT_STATE="on-demand"
PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE="enabled"
PRISMOS_DOCK_APPLY_BOOT_STATE="enabled"

# Timeout di idle dopo il quale un sottosistema viene comunque spento anche se
# il processo ospite e' ancora vivo ma in background (0 = disattivato).
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="120"

# Numero massimo di istanze concorrenti di Waydroid/Wine (1 in SLIM: un solo
# sottosistema alla volta, il secondo richiesta chiude il primo).
PRISMOS_SUBSYSTEM_MAX_INSTANCES="1"

# Comportamento alla chiusura dell'app: kill immediato del container.
PRISMOS_SUBSYSTEM_TEARDOWN="aggressive"
PRISMOS_SUBSYSTEM_TEARDOWN_GRACE_SEC="3"

PRISMOS_SHELF_PIN_MAX="6"
PRISMOS_SHELF_AUTOHIDE="Always"
PRISMOS_SHELF_ALIGNMENT="Bottom"
PRISMOS_SHELF_ICON_SIZE="40"
PRISMOS_SHELF_SQUIRCLE_RADIUS="0.28"

export PRISMOS_EDITION_ID PRISMOS_EDITION_NAME PRISMOS_EDITION_TAGLINE
export PRISMOS_POLICY_SOURCE PRISMOS_POLICY_TARGET PRISMOS_ROOTFS_FILES
export PRISMOS_EXTRA_PACKAGES PRISMOS_REMOVED_PACKAGES
export PRISMOS_WAYDROID_BOOT_STATE PRISMOS_WINE_BOOT_STATE
export PRISMOS_ACCELERATOR_DAEMON_BOOT_STATE PRISMOS_DOCK_APPLY_BOOT_STATE
export PRISMOS_SUBSYSTEM_IDLE_TIMEOUT PRISMOS_SUBSYSTEM_MAX_INSTANCES
export PRISMOS_SUBSYSTEM_TEARDOWN PRISMOS_SUBSYSTEM_TEARDOWN_GRACE_SEC
export PRISMOS_SHELF_PIN_MAX PRISMOS_SHELF_AUTOHIDE PRISMOS_SHELF_ALIGNMENT
export PRISMOS_SHELF_ICON_SIZE PRISMOS_SHELF_SQUIRCLE_RADIUS
