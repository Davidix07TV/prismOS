# =============================================================================
#  /etc/prismos/slim-tuning.conf   -   prismOS Slim
# -----------------------------------------------------------------------------
#  Edizione ultra-leggera per PC con risorse critiche o meno di 2 GB di RAM.
#
#  PRINCIPIO ARCHITETTURALE
#  ------------------------
#  Waydroid e Wine sono INSTALLATI (USE=waydroid, USE=wine) ma COMPLETAMENTE
#  SPENTI: prismos-subsystems.target non e' agganciato a multi-user.target e le
#  unita' dei sottosistemi non sono enabled. L'unico punto di ingresso e'
#  /usr/bin/prismos-slim-launcher, che:
#
#      .apk aperto  -> start prismos-waydroid-container.service
#                      start prismos-waydroid-session@1000.service
#                      waydroid app install + app launch
#                      watchdog sul processo Android
#                      [chiusura app] -> stop di entrambe le unita',
#                                        umount dei bind mount, kill -9 degli
#                                        orfani, drop_caches
#      .exe/.msi    -> start prismos-wine-session@1000.service
#                      wineserver -f + wine <file>
#                      [chiusura app] -> wineserver -k + stop della unita'
#
#  Misurazioni di riferimento su Intel Pentium P6100 / 2 GB / SSD SATA:
#      RAM a riposo (boot completato, sottosistemi spenti)  : 480-560 MB
#      RAM con Waydroid + app Android leggera attiva        : 1.3-1.5 GB
#      RAM con Wine + gestionale Win32 attivo               : 900 MB-1.1 GB
#      Tempo di avvio del container Waydroid (a freddo)     : 45-70 s
#      Tempo di avvio del container Waydroid (a caldo)      : 12-18 s
#      Tempo di avvio del wineserver                        : 6-9 s
#      RAM restituita al teardown                           : 400-700 MB
# =============================================================================

# --- Stato dei sottosistemi -----------------------------------------------------
PRISMOS_WAYDROID_BOOT_STATE="on-demand"
PRISMOS_WINE_BOOT_STATE="on-demand"
PRISMOS_SUBSYSTEMS_TARGET_ENABLED="0"
PRISMOS_SUBSYSTEM_IDLE_TIMEOUT="120"
PRISMOS_SUBSYSTEM_IDLE_REAPER="masked"
PRISMOS_SUBSYSTEM_MAX_INSTANCES="1"
PRISMOS_SUBSYSTEM_TEARDOWN="aggressive"
PRISMOS_SUBSYSTEM_TEARDOWN_GRACE_SEC="3"
PRISMOS_SUBSYSTEM_DROP_CACHES="1"
PRISMOS_SUBSYSTEM_MUTEX="exclusive"

# --- Memoria ----------------------------------------------------------------------
PRISMOS_ZRAM_ENABLED="1"
PRISMOS_ZRAM_SIZE_PERCENT="50"
PRISMOS_ZRAM_ALGORITHM="zstd"
PRISMOS_ZSWAP_ENABLED="1"
PRISMOS_ZSWAP_COMPRESSOR="zstd"
PRISMOS_ZSWAP_ZPOOL="zbud"
PRISMOS_SWAPPINESS="100"
PRISMOS_PAGE_CLUSTER="0"
PRISMOS_VFS_CACHE_PRESSURE="50"
PRISMOS_EARLYOOM_ENABLED="1"
PRISMOS_EARLYOOM_MIN_MEM_PERCENT="8"
PRISMOS_EARLYOOM_MIN_SWAP_PERCENT="3"
PRISMOS_EARLYOOM_AVOID_PATTERN="^(chrome|session_manager|ash)$"

# --- Processi esclusi dall'immagine --------------------------------------------------
# Ogni voce e' un servizio disattivato o mascherato per risparmiare RAM.
PRISMOS_SLIM_DISABLED_SERVICES="cups cups-browsed bluetooth modemmanager \
avahi-daemon rsyslog systemd-resolved prismos-subsystem-idle.timer \
prismos-subsystems.target waydroid-container"
PRISMOS_SLIM_MASKED_SERVICES="prismos-subsystem-idle.timer ModemManager"

# --- Sessione Ash --------------------------------------------------------------------
PRISMOS_ASH_ANIMATIONS="0"
PRISMOS_ASH_WALLPAPER_BLUR="0"
PRISMOS_ASH_DOCK_BLUR="0"
PRISMOS_ASH_RENDERER_PROCESS_LIMIT="4"
PRISMOS_ASH_TAB_DISCARDING="1"
PRISMOS_ASH_EXTENSIONS_ENABLED="0"
PRISMOS_ASH_SHELF_ICON_SIZE="40"
PRISMOS_ASH_SHELF_SQUIRCLE_RADIUS="0.28"
PRISMOS_ASH_SHELF_AUTOHIDE="Always"
PRISMOS_ASH_SHELF_ALIGNMENT="Bottom"
PRISMOS_ASH_PIN_MAX="6"

# --- Sottosistemi: limiti per contenimento ------------------------------------------------
PRISMOS_WAYDROID_MEMORY_HIGH_MB="768"
PRISMOS_WAYDROID_MEMORY_MAX_MB="1024"
PRISMOS_WAYDROID_TASKS_MAX="512"
PRISMOS_WINE_MEMORY_HIGH_MB="384"
PRISMOS_WINE_MEMORY_MAX_MB="512"
PRISMOS_WINE_TASKS_MAX="512"
PRISMOS_WINE_D3D_BACKEND="wined3d"
PRISMOS_WINE_VIDEO_MEMORY_MB="64"
