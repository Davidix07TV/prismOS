# =============================================================================
#  /etc/prismos/slim-launcher.conf   -   override della edizione Slim
# -----------------------------------------------------------------------------
#  Questo file viene copiato dalla board overlay DOPO l'installazione del
#  pacchetto app-misc/prismos-slim-launcher, quindi ne sostituisce la versione
#  generica. I valori sono tarati su macchine con meno di 2 GB di RAM.
# =============================================================================

PRISMOS_SLIM_WAYDROID_ENABLED=1
PRISMOS_SLIM_WINE_ENABLED=1

# Idle aggressivo: dopo 2 minuti senza input l'app ospite viene chiusa e il
# sottosistema smontato. Con 2 GB di RAM tenere il container Android attivo "per
# sicurezza" non e' accettabile.
PRISMOS_SLIM_IDLE_TIMEOUT=120

# Avvio del container: su Pentium P6100 con SSD SATA servono 45-70 s a freddo
# (decompressione e mount di system.img), 12-18 s a caldo.
PRISMOS_SLIM_BOOT_TIMEOUT=120

PRISMOS_SLIM_POLL_INTERVAL=2

# Una sola istanza: Waydroid e Wine non possono coesistere con meno di 2 GB.
# Se l'utente apre un .exe mentre un'app Android e' attiva, il launcher chiude
# prima il container Android (mutex esclusiva fra sottosistemi).
PRISMOS_SLIM_MAX_INSTANCES=1

PRISMOS_SLIM_TEARDOWN_GRACE_SEC=3

# Restituzione della page cache al termine del sottosistema: su macchine con
# 1-2 GB restituisce tipicamente 300-500 MB.
PRISMOS_SLIM_DROP_CACHES=1

PRISMOS_SLIM_WINE_PREFIX_ROOT="/home/chronos/user/WineBottles"
PRISMOS_SLIM_WINE_DEFAULT_PREFIX="Slim"
PRISMOS_SLIM_WAYDROID_IMAGE_DIR="/var/lib/waydroid/images"

PRISMOS_SLIM_ALLOW_INSTALL=1
PRISMOS_SLIM_VERIFY_ISA=1
PRISMOS_SLIM_USE_PKEXEC=1
PRISMOS_SLIM_LOG_LEVEL="info"
