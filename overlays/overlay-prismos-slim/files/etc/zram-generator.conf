# =============================================================================
#  /etc/zram-generator.conf   -   prismOS Slim
# -----------------------------------------------------------------------------
#  Swap compressa in RAM. Su una macchina con 2 GB, un device zram da 1 GB con
#  zstd offre una capacita' effettiva di 2.5-3 GB (rapporto medio 2.8:1 su
#  pagine anonime di Chromium) al costo di circa il 3% di CPU su 2 core.
#
#  zstd e' preferito a lz4 perche' il collo di bottiglia di prismOS Slim e' la
#  RAM, non la CPU: zstd comprime il 25-30% in piu' a fronte di un costo di
#  decompressione quasi identico (la decompressione zstd e' asimmetrica e resta
#  nell'ordine dei GB/s anche su Arrandale).
# =============================================================================

[zram0]
# Dimensione: meta' della RAM fisica, con un minimo di 256 MiB e un massimo di
# 2 GiB (oltre questa soglia il beneficio marginale sparisce).
zram-size = min(max(ram / 2, 256), 2048)

compression-algorithm = zstd

# Priorita' alta rispetto a eventuali partizioni swap su disco: la swap su zram
# e' ordini di grandezza piu' veloce di un disco meccanico SATA.
swap-priority = 100

fs-type = swap

# Scrittura della memoria anonima su zram appena possibile, senza attendere che
# il page cache sia sotto pressione: riduce i picchi di latenza durante l'avvio
# del container Waydroid.
writeback-enabled = false
