# =============================================================================
#  prismOS Slim :: drop-in per prismos-waydroid-container.service
#  Installato in /etc/systemd/system/prismos-waydroid-container.service.d/
#  Solo con USE=slim-ondemand. Rende il container "usa e getta": memoria
#  limitata, nessuna permanenza dopo lo stop, kill aggressivo.
# =============================================================================
[Unit]
# Nessun avvio automatico: la unita' e' statica rispetto a multi-user.target
# e viene trascinata soltanto da prismos-subsystems.target (disabilitato in
# Slim) oppure avviata esplicitamente da /usr/bin/prismos-slim-launcher.
DefaultDependencies=no
StartLimitIntervalSec=120
StartLimitBurst=3
ConditionPathExists=/var/lib/waydroid/images/system.img

[Service]
RemainAfterExit=no
TimeoutStartSec=90
TimeoutStopSec=8
KillMode=mixed
KillSignal=SIGTERM
FinalKillSignal=SIGKILL
SendSIGKILL=yes
OOMPolicy=kill
# Tetto di memoria: oltre 1 GiB il container Android 9 su macchina <2 GB
# manderebbe in OOM la sessione Ash.
MemoryHigh=768M
MemoryMax=1024M
MemorySwapMax=256M
CPUWeight=90
IOWeight=80
TasksMax=512
