# =============================================================================
#  prismOS Slim :: drop-in per prismos-wine-session@<uid>.service
# =============================================================================
[Unit]
DefaultDependencies=no
StopWhenUnneeded=yes

[Service]
RemainAfterExit=no
TimeoutStartSec=45
TimeoutStopSec=6
KillMode=mixed
KillSignal=SIGTERM
FinalKillSignal=SIGKILL
OOMPolicy=kill
MemoryHigh=512M
MemoryMax=768M
CPUWeight=100
# wineserver resta vivo ~3 s dopo l'uscita dell'ultimo processo per permettere
# rilanci rapidi; in Slim lo si vuole morto subito per restituire la RAM.
Environment="WINESERVER_PERSIST=0"
