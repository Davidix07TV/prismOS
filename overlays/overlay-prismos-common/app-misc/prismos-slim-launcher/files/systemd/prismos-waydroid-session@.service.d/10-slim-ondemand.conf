# =============================================================================
#  prismOS Slim :: drop-in per prismos-waydroid-session@<uid>.service
# =============================================================================
[Unit]
DefaultDependencies=no
Requires=prismos-waydroid-container.service
After=prismos-waydroid-container.service
StopWhenUnneeded=yes

[Service]
RemainAfterExit=no
TimeoutStartSec=60
TimeoutStopSec=6
KillMode=mixed
FinalKillSignal=SIGKILL
OOMPolicy=kill
MemoryHigh=384M
MemoryMax=512M
CPUWeight=100
# La sessione non deve sopravvivere all'app ospite: StopWhenUnneeded la fa
# terminare quando prismos-slim-launcher rilascia il riferimento.
