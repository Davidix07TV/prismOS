# =============================================================================
#  /etc/prismos/slim-launcher.conf
#  Configurazione di /usr/bin/prismos-slim-launcher
#  Permessi richiesti: 0644 root:root (il file viene sorgiato: NON renderlo
#  scrivibile da gruppo o altri, altrimenti l'helper lo ignora per sicurezza).
# =============================================================================

# --- Abilitazione dei sottosistemi -------------------------------------------
# 0 = il sottosistema non viene mai avviato (exit code 3).
PRISMOS_SLIM_WAYDROID_ENABLED=1
PRISMOS_SLIM_WINE_ENABLED=1

# --- Timing -------------------------------------------------------------------
# Secondi di inattivita' dell'input oltre i quali l'app ospite viene chiusa e
# il sottosistema smontato. 0 disattiva il watchdog di idle.
PRISMOS_SLIM_IDLE_TIMEOUT=120

# Secondi massimi per l'avvio del container Waydroid / del wineserver.
# Su Intel Pentium P6100 con disco meccanico servono 40-70 s per il primo
# avvio a freddo (decompressione di system.img e mount di /dev/binderfs).
PRISMOS_SLIM_BOOT_TIMEOUT=90

# Intervallo di poll del watchdog sui processi ospiti.
PRISMOS_SLIM_POLL_INTERVAL=2

# Istanze concorrenti ammesse per sottosistema. In prismOS Slim deve restare 1:
# con meno di 2 GB di RAM due container attivi causano OOM.
PRISMOS_SLIM_MAX_INSTANCES=1

# --- Teardown -----------------------------------------------------------------
# Secondi fra SIGTERM e SIGKILL dell'applicazione ospite.
PRISMOS_SLIM_TEARDOWN_GRACE_SEC=3

# 1 = esegue `sync; echo 3 > /proc/sys/vm/drop_caches` dopo lo smontaggio.
# Libera la page cache occupata dalle immagini del container: su macchine con
# 1-2 GB restituisce tipicamente 300-500 MB, al costo di un breve stall I/O.
PRISMOS_SLIM_DROP_CACHES=0

# --- Percorsi ------------------------------------------------------------------
PRISMOS_SLIM_WINE_PREFIX_ROOT="/home/chronos/user/WineBottles"
PRISMOS_SLIM_WINE_DEFAULT_PREFIX="Slim"
PRISMOS_SLIM_WAYDROID_IMAGE_DIR="/var/lib/waydroid/images"

# --- Sicurezza / installazione -------------------------------------------------
# 1 = permette `waydroid app install` (sideload APK). 0 = solo avvio di app
# gia' presenti nel container (utile nei laboratori con APK pre-approvati).
PRISMOS_SLIM_ALLOW_INSTALL=1

# 1 = esegue un controllo euristico (objdump) alla ricerca di istruzioni
# SSE4.2/POPCNT dentro i PE prima dell'avvio, e logga un warning.
PRISMOS_SLIM_VERIFY_ISA=1

# 1 = usa pkexec per elevare i privilegi su systemctl; se assente ripiega su
# `sudo -n` con le regole di /etc/sudoers.d/prismos-slim-launcher.
PRISMOS_SLIM_USE_PKEXEC=1

# --- Logging --------------------------------------------------------------------
# debug | info | warn | error
PRISMOS_SLIM_LOG_LEVEL="info"
