# =============================================================================
#  /usr/share/prismos/ash-shelf.conf   (app-misc/prismos-dock)
# -----------------------------------------------------------------------------
#  Configurazione dichiarativa della Dock prismOS (filosofia macOS-like).
#  Letta da /usr/libexec/prismos/prismos-dock-apply e da scripts/build_iso.sh.
#
#  Ogni voce puo' essere sovrascritta a riga di comando:
#    prismos-dock-apply --alignment Bottom --autohide Always --icon-size 48 \
#                       --squircle 0.28 --pin-max 8
#  Le edizioni possono fornire un file proprio in
#  /etc/prismos/ash-shelf.conf (ha priorita' se passato con --conf).
# =============================================================================

[dock]
# --- Posizione -----------------------------------------------------------------
# La Shelf e' FORZATA in basso. Su ChromeOS la policy ShelfAlignment e'
# vincolante per l'utente: non puo' essere spostata a sinistra/destra.
alignment = Bottom

# Autohide sempre attivo: la Dock compare solo al passaggio del puntatore sul
# bordo inferiore, come nel Dock di macOS con "Nascondi e mostra
# automaticamente il Dock".
autohide = Always

# Centraggio orizzontale del gruppo di icone (il launcher resta a sinistra, il
# system tray a destra, esattamente come su macOS).
centered = True

# Offset in pixel dal bordo inferiore (0 = aderente al bordo).
dock_offset_bottom = 0

# --- Icone -----------------------------------------------------------------------
# Dimensione del lato dell'icona in pixel (macOS usa 48-64 px a seconda del
# livello di zoom). Range ammesso: 24-96.
icon_size = 48

# Spaziatura fra le icone.
icon_spacing = 8

# Maschera squircle: rapporto fra il raggio di arrotondamento e il lato.
# 0.225 e' il valore usato da Apple per le icone di Big Sur (22.37% del lato);
# prismOS usa 0.28 per una curvatura leggermente piu' pronunciata, piu'
# leggibile sui pannelli 1366x768 dei portatili legacy.
squircle_radius = 0.28

# Esponente della superellisse: 2 = cerchio, 4-5 = squircle Apple, 8+ = quasi
# quadrato. Il tracciato SVG e' generato con Bezier cubiche.
squircle_exponent = 5.0

# --- Comportamento -----------------------------------------------------------------
# Numero massimo di icone bloccate. Oltre questa soglia le app restano nel
# launcher ma non sulla Dock: evita il ridimensionamento automatico delle
# icone su schermi piccoli.
pin_max = 8

# Indicatore di finestra aperta (puntino sotto l'icona, come su macOS).
show_window_indicators = True

# Ingrandimento al passaggio del puntatore (effetto "genio" del Dock).
# Disattivato di default: su Intel HD Graphics Gen5 l'animazione costa frame.
magnification_on_hover = False
magnification_factor = 1.35

# Durata delle animazioni di comparsa/scomparsa in millisecondi.
animation_duration_ms = 180

# Sfondo traslucido con blur (effetto vibrancy). Su Gen5 il blur e' renderizzato
# da Ash in software: se le prestazioni calano, impostare false.
background_blur = True
background_opacity = 0.86

# Hotseat (riga di app suggerite) collassabile quando la Shelf e' in autohide.
hotseat_collapsible = True

# --- Launcher centralizzato (stile Spotlight) ----------------------------------------
# Posizione del pulsante del launcher sulla Shelf: "left" (default ChromeOS),
# "center" (prismOS: il launcher e' il primo elemento del gruppo centrato).
launcher_button_position = center

# Scorciatoia globale che apre il launcher a tutto schermo in modalita' ricerca,
# equivalente a Cmd+Space di macOS. Implementata da
# app-misc/prismos-accelerator-daemon (che inietta KEY_SEARCH via uinput).
launcher_accelerator = super+space

# Seconda scorciatoia: ricerca web diretta senza aprire il launcher.
web_search_accelerator = super+shift+space

# Terza scorciatoia: schermata di blocco immediata (Cmd+Ctrl+Q su macOS).
lock_accelerator = super+l
