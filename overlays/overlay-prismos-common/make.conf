# =============================================================================
#  prismOS :: overlay-prismos-common :: make.conf
# -----------------------------------------------------------------------------
#  Configurazione globale del toolchain per la compilazione di un'immagine
#  ChromiumOS destinata a CPU x86_64 PRIVE del set di istruzioni SSE4.2.
#
#  Hardware di riferimento (validated matrix):
#    Intel Pentium P6100 / P6000 / U5400  (Arrandale, 32 nm, Westmere-derived)
#    Intel Core i3-330UM / i3-350M        (Arrandale, SSE4.2 presente -> OK)
#    Intel Celeron P4500 / P4600          (Arrandale, SSE4.1 only)
#    Intel Core 2 Duo/Quad (Penryn/Wolfdale, SSSE3 only -> declassati a -mtune)
#
#  Il Pentium P6100 espone via CPUID.01H:ECX soltanto:
#      SSE3, SSSE3, SSE4.1        (bit 0, 9, 19)
#  e NON espone:
#      SSE4.2 (bit 20), POPCNT (bit 23), AES-NI (bit 25), PCLMULQDQ (bit 1),
#      AVX (bit 28), F16C (bit 29)
#  Intel ha fisicamente disabilitato tali unita' sui die "Pentium/Celeron"
#  derivati da Arrandale: non esistono microcode o BIOS che possano riattivarle.
#
#  Conseguenza: ogni binario linkato nell'immagine deve rispettare un floor ISA
#  di SSE4.1. Un singolo oggetto compilato con -msse4.2 (o che contenga POPCNT)
#  causa SIGILL / KMODE_EXCEPTION al primo avvio del processo che lo carica.
#
#  Questo file e' incluso da:
#    1. overlays/overlay-amd64-prismos/make.conf      (board amd64-prismos)
#    2. /etc/portage/make.conf dentro il chroot cros_sdk (link simbolico creato
#       da scripts/sync_overlays.sh durante build_iso.sh)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. TARGET TRIPLE / TOOLCHAIN
# -----------------------------------------------------------------------------
CHOST="x86_64-cros-linux-gnu"
CBUILD="${CHOST}"
CTARGET="${CHOST}"

# Toolchain di default: GCC per il userspace Portage, Clang per ChromeOS/Chromium
# (chromeos-chrome forza autonomamente il proprio clang hermetic).
CC="x86_64-cros-linux-gnu-gcc"
CXX="x86_64-cros-linux-gnu-g++"

# -----------------------------------------------------------------------------
# 2. FLOOR ISA - BLOCCO OBBLIGATORIO (non modificare l'ordine dei flag)
# -----------------------------------------------------------------------------
# Ordine significativo: -march=nehalem attiva SSE4.2 + POPCNT; i flag negativi
# devono seguire per sottrarre le estensioni assenti sul silicio.
#
#   -O2            ottimizzazione senza aumentare la pressione sui registri
#                  (evita l'unrolling aggressivo di -O3 che su Arrandale a
#                  2 thread e' controproducente e gonfia il footprint L2)
#   -pipe          nessuna generazione di file .o intermedi su disco
#   -march=nehalem modello ISA piu' vicino ad Arrandale esprimibile in GCC che
#                  includa SSE4.1 completo (dndot/pack/blend/round)
#   -mno-sse4.2    *** VINCOLO HARD *** rimuove CRC32, PCMPESTRI/PCMPESTRM,
#                  PCMPISTRI/PCMPISTRM, PCMPGTQ
#   -msse4.1       riasserisce esplicitamente SSE4.1 come baseline garantita
#
# -mno-popcnt e' aggiunto perche' in GCC POPCNT e' un bit ISA INDIPENDENTE da
# SSE4.2: `-march=nehalem` lo attiva e `-mno-sse4.2` NON lo disattiva. Senza
# questo flag ogni `__builtin_popcountll()` inlineato genera `popcnt %reg,%reg`
# e la CPU va in #UD (undefined opcode). Stesso ragionamento per AVX/ABM/AES.
PRISMOS_ISA_FLOOR="-march=nehalem -mno-sse4.2 -msse4.1 -mno-popcnt"

# Ulteriori estensioni assenti sul silicio: disattivate per blindare il floor
# anche nel caso in cui un ebuild sovrascriva CFLAGS con il proprio -march.
PRISMOS_ISA_DENY="-mno-avx -mno-avx2 -mno-avx512f -mno-bmi -mno-bmi2 -mno-f16c \
-mno-fma -mno-aes -mno-pclmul -mno-abm -mno-sse4a -mno-3dnow -mno-mmx3dnow \
-mno-sha -mno-adx -mno-rdrnd -mno-rtm -mno-tsx"

# -mtune=westmere: scheduling ottimale per il die Arrandale (stessa pipeline
# dei Core i5-4xxM) SENZA introdurre istruzioni: -mtune non modifica l'ISA,
# soltanto l'ordinamento/la selezione delle sequenze equivalenti.
PRISMOS_TUNING="-mtune=westmere"

# Flag comuni a tutti i linguaggi nativi compilati.
COMMON_FLAGS="-O2 -pipe ${PRISMOS_ISA_FLOOR} ${PRISMOS_ISA_DENY} ${PRISMOS_TUNING}"

# -----------------------------------------------------------------------------
# 3. HARDENING / ABI
# -----------------------------------------------------------------------------
# -fstack-protector-strong : default ChromeOS, costo trascurabile su Arrandale
# -D_FORTIFY_SOURCE=2      : controlli glibc su memcpy/strcpy/sprintf
# -fno-semantic-interposition : riduce i PLT indiretti nelle .so C++ (-fPIC)
# -fcf-protection=none     : ENDBRANCH (CET) richiede Ice Lake+; su P6100 e'
#                            solo codice morto che consuma icache
# -fno-omit-frame-pointer  : mantiene i frame pointer per crash_reporter di
#                            ChromeOS (perf di minidump_stackwalk affidabile)
HARDENING_FLAGS="-fstack-protector-strong -Wp,-D_FORTIFY_SOURCE=2 \
-fno-semantic-interposition -fcf-protection=none -fno-omit-frame-pointer"

CFLAGS="${COMMON_FLAGS} ${HARDENING_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${HARDENING_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
OBJCFLAGS="${COMMON_FLAGS}"
OBJCXXFLAGS="${COMMON_FLAGS}"

# Linker: lld (usato da ChromiumOS) + full RELRO/NOW. --icf=safe e' l'unico
# livello di Identical Code Folding sicuro con C++ (niente alias di funzioni
# con indirizzi confrontabili). --as-needed elimina DSO inutilizzati: su
# macchine con <2 GB di RAM ogni pagina mappata in meno e' preziosa.
LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,--hash-style=gnu -Wl,--icf=safe \
-Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack -Wl,--build-id=sha1"

# Rust (www-client/chromium dipende da librerie Rust a partire da M114):
# target-cpu=x86-64 = baseline SSE2, poi si aggiungono SOLO le feature reali.
# Usare target-cpu=nehalem qui equivarrebbe a compilare con +sse4.2,+popcnt.
RUSTFLAGS="-C opt-level=2 -C debuginfo=0 -C target-cpu=x86-64 \
-C target-feature=+sse2,+sse3,+ssse3,+sse4.1,-sse4.2,-popcnt,-avx,-avx2 \
-C panic=unwind -C relocation-model=pic"

# Go (crosvm-adjacent, minijail helper, some ChromiumOS services):
# GOAMD64=v1 = ABI x86-64 baseline (SSE2). v2 richiederebbe SSE4.2+POPCNT,
# v3 richiederebbe AVX2. Nessun binario Go dell'immagine deve superare v1.
GOAMD64="v1"

# Zig / npm native addons ereditano CFLAGS via CC; si esplicita per sicurezza.
export CC CXX CFLAGS CXXFLAGS LDFLAGS RUSTFLAGS GOAMD64

# -----------------------------------------------------------------------------
# 4. GPU - INTEL HD GRAPHICS 1a GENERAZIONE (Ironlake / Gen5, device 0x0046)
# -----------------------------------------------------------------------------
# Il Pentium P6100 integra la "Intel HD Graphics" (Ironlake-M, Gen5, EU x2).
# Limiti hardware documentati che guidano le scelte sottostanti:
#
#   * OpenGL  : 2.1 (Mesa driver "crocus"). NIENTE OpenGL 3.3+, niente GLES 3.
#               => Chromium usa ANGLE su OpenGL ES 2.0; SwiftShader come
#                  fallback quando la GPU e' in black-list.
#   * Vulkan  : ASSENTE (il primo driver Intel Vulkan e' Gen8/Skylake "anv").
#               => DXVK/VKD3D inutilizzabili: Wine deve usare wined3d (GL).
#   * VA-API  : parziale. media-libs/libva-intel-driver (i965) su Gen5 espone
#               VAProfileMPEG2Main (VLD) e VC1; la decodifica H.264/AV1 NON e'
#               accelerata su Ironlake. Si abilita comunque vaapi per MPEG2 e
#               per il path "video decode -> texture" quando disponibile, ma la
#               riproduzione H.264/VP9 ricade su decode software (dav1d/ffmpeg
#               con path SIMD SSE4.1, che e' esattamente cio' che vogliamo).
#   * Display : LVDS/eDP + CRT/VGA via DAC integrato, max 2 pipe.
#
# VIDEO_CARDS:
#   intel   -> abilita i backend Intel in mesa (crocus per Gen4-Gen7)
#   crocus  -> driver Gallium dedicato Gen4-Gen7 (sostituisce i965 classico)
#   i965    -> libva-intel-driver (VA-API legacy Gen4-Gen9) + DRI2 fallback
#   iris    -> ESCLUSO: richiede Gen8+
#   zink    -> ESCLUSO: traduce GL su Vulkan, qui Vulkan non esiste
#   lavapipe-> ESCLUSO: rasterizzatore software Vulkan, inutile e costoso
VIDEO_CARDS="intel crocus i965 -iris -radeonsi -r300 -r600 -nouveau -vmware -zink -lavapipe -d3d12"

INPUT_DEVICES="libinput evdev synaptics wacom -void"

ALSA_CARDS="hda-intel"
ALSA_PCM_PLUGINS="adpcm alaw asym copy dmix dshare dsnoop empty extplug file hooks \
iec958 ioplug ladspa lfloat linear meter mmap_emul mulaw multi null plug rate \
route share shm softvol"

# Variabili runtime esportate nell'immagine da app-misc/prismos-runtime-config
# (file /etc/env.d/50prismos-gpu). Sono dichiarate qui perche' il valore deve
# restare coerente con VIDEO_CARDS scelto in fase di compilazione.
PRISMOS_LIBVA_DRIVER_NAME="i965"
PRISMOS_MESA_LOADER_DRIVER_OVERRIDE="crocus"
PRISMOS_GLX_VENDOR_LIBRARY_NAME="mesa"
PRISMOS_CHROME_GPU_FLAGS="--use-gl=angle --use-angle=gl \
--ignore-gpu-blocklist --enable-gpu-rasterization=false \
--disable-gpu-sandbox --num-raster-threads=1 \
--disable-features=VaapiVideoDecoder,VaapiVideoEncoder,UseChromeOSDirectVideoDecoder \
--enable-features=CanvasOopRasterization"

# -----------------------------------------------------------------------------
# 5. CHROMIUM / CHROMEOS - ARGOMENTI GN
# -----------------------------------------------------------------------------
# chromeos-chrome compila con il proprio clang hermetic e IGNORA CFLAGS di
# Portage; il floor ISA va quindi forzato a livello GN. L'eclass
# prismos-legacy-cpu.eclass inietta PRISMOS_CHROME_GN_ARGS nel comando
# `gn gen` dell'ebuild di chromeos-chrome.
#
#   x64_arch="generic" : Chromium seleziona -march=x86-64 (SSE2 baseline)
#                        invece di "haswell" (AVX2). E' l'interruttore piu'
#                        importante dell'intera build.
#   is_cfi=false       : Clang CFI su target legacy genera overhead e richiede
#                        LTO completo
#   use_thin_lto=false : ThinLTO propaga -march fra unita' di traduzione e
#                        re-introduce SSE4.2 dove il flag e' stato ereditato
#   enable_nacl=false  : NaCl rimosso; niente sandbox x86 legacy
#   ffmpeg_branding="Chrome" + proprietary_codecs=true : H.264/AAC/MP3
PRISMOS_CHROME_GN_ARGS="x64_arch=\"generic\" \
target_cpu=\"x64\" \
target_os=\"chromeos\" \
is_official_build=true \
is_debug=false \
use_thin_lto=false \
is_cfi=false \
enable_cros_ime=true \
enable_nacl=false \
enable_widevine=true \
bundle_widevine_cdm=true \
ffmpeg_branding=\"Chrome\" \
proprietary_codecs=true \
media_use_ffmpeg=true \
use_vaapi=false \
use_v4l2_codec=false \
enable_mse_mpeg2ts_stream_parser=true \
chrome_pgo_phase=0 \
symbol_level=0 \
blink_symbol_level=0 \
dcheck_always_on=false"

# Argomenti GN supplementari per le estensioni ChromiumOS (crosvm, seneschal).
PRISMOS_CROS_GN_ARGS="x64_arch=\"generic\" target_cpu=\"x64\""

# -----------------------------------------------------------------------------
# 6. KERNEL
# -----------------------------------------------------------------------------
# Splitconfig prismOS dentro src/third_party/kernel/<ver>/chromeos/config/.
# Copiato da scripts/sync_overlays.sh a partire da kernel/chromeos/config/.
CHROMEOS_KERNEL_SPLITCONFIG="chromiumos-x86_64/prismos_legacy"
CHROMEOS_KERNEL_VERSION="6.1"

# -----------------------------------------------------------------------------
# 7. USE GLOBALI (il set autoritativo vive in profiles/base/make.defaults)
# -----------------------------------------------------------------------------
# make.conf puo' solo APPENDERE: la maschera di profilo (-arc/-arc-plus) ha
# priorita' e non e' aggirabile da qui. Vedi profiles/base/use.mask.
USE="${USE} -arc -arc-plus waydroid wine proton vaapi branded-chromium widevine h264 aac mp3"

# -----------------------------------------------------------------------------
# 8. PORTAGE - PARALLELISMO E MEMORIA
# -----------------------------------------------------------------------------
# La build host tipica (workstation 16 GB) ma i target hanno 2-4 GB: si limita
# il parallelismo di link di Chromium, che e' il picco di memoria del processo.
MAKEOPTS="-j$(nproc 2>/dev/null || echo 4) -l$(nproc 2>/dev/null || echo 4)"
EMERGE_DEFAULT_OPTS="--with-bdeps=y --keep-going=n --verbose-conflicts \
--jobs=$(nproc 2>/dev/null || echo 4) --load-average=$(nproc 2>/dev/null || echo 4)"

FEATURES="parallel-fetch buildpkg binpkg-multi-instance compress-buildprotected \
-multilib-strict -usersandbox -network-sandbox -pid-sandbox \
splitdebug compressdebug -candy -test -getbinpkg"

# Multilib strict: su target legacy una libreria i386 linkata male (Wine) e'
# un crash a runtime; si lascia attivo il controllo e si risolve con USE=abi_x86_32.
PORTAGE_NICENESS="10"
PORTAGE_IONICE_COMMAND="ionice -c3 -p \${PID}"
PORTAGE_COMPRESS="xz"
PORTAGE_COMPRESS_FLAGS="-9T0"
PORTAGE_TMPFS="/var/tmp/portage"
PORTAGE_LOGDIR="/var/log/portage"

# Binhost: le immagini prismOS condividono i pacchetti fra le 4 edizioni; solo
# i pacchetti marcati USE=slim-ondemand differiscono. Lasciare vuoto in CI
# pubblica (nessun binhost raggiungibile) e valorizzare nel build server interno.
PORTAGE_BINHOST=""

# -----------------------------------------------------------------------------
# 9. LOCALIZZAZIONE E ABI
# -----------------------------------------------------------------------------
LINGUAS="it en en_GB es fr de pt pt_BR"
L10N="it en en-GB es fr de pt pt-BR"

# abi_x86_32 e' OBBLIGATORIO: Wine esegue binari Win32 (PE i386) dentro
# prefix a 64 bit tramite wow64. Disattivarlo renderebbe inutilizzabili
# tutti gli installer .exe a 32 bit, che sono la maggioranza su hardware legacy.
MULTILIB_ABIS="amd64 x86"
ABI_X86="64 32"

PYTHON_TARGETS="python3_11"
PYTHON_SINGLE_TARGET="python3_11"
RUBY_TARGETS="ruby31"
LLVM_TARGETS="X86"
GRUB_PLATFORMS="efi-64 coreboot pc"
QEMU_SOFTMMU_TARGETS="i386 x86_64"
QEMU_USER_TARGETS=""
PHP_TARGETS=""
CURL_SSL="openssl"
NGINX_MODULES_HTTP=""

# -----------------------------------------------------------------------------
# 10. IDENTITA' DISTRIBUTIVA
# -----------------------------------------------------------------------------
PRISMOS_DISTRO_NAME="prismOS"
PRISMOS_DISTRO_CODENAME="Legacy Prism"
PRISMOS_BOARD="amd64-prismos"
PRISMOS_ISA_FLOOR_LABEL="x86_64-SSE4.1"
PRISMOS_MIN_RAM_MB="1024"

# Le variabili PRISMOS_* sono lette da scripts/build_iso.sh e dai profili
# delle quattro edizioni (profiles/*.conf). Vengono esportate affinche' le
# subprocess (emerge, cros_*) le ereditino.
export PRISMOS_DISTRO_NAME PRISMOS_DISTRO_CODENAME PRISMOS_BOARD
export PRISMOS_ISA_FLOOR PRISMOS_ISA_DENY PRISMOS_TUNING
export PRISMOS_LIBVA_DRIVER_NAME PRISMOS_MESA_LOADER_DRIVER_OVERRIDE
export PRISMOS_GLX_VENDOR_LIBRARY_NAME PRISMOS_CHROME_GPU_FLAGS
export PRISMOS_CHROME_GN_ARGS PRISMOS_CROS_GN_ARGS
export PRISMOS_ISA_FLOOR_LABEL PRISMOS_MIN_RAM_MB
export CHROMEOS_KERNEL_SPLITCONFIG CHROMEOS_KERNEL_VERSION
