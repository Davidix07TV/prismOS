# =============================================================================
#  /var/lib/waydroid/waydroid.cfg   (prismOS Legacy)
# -----------------------------------------------------------------------------
#  Sostituisce il file generato da `waydroid init`. Le scelte sono vincolate
#  dall'hardware di destinazione: Intel Arrandale (Gen5), SSE4.1 massimo,
#  1-2 GB di RAM, Intel HD Graphics senza Vulkan e con OpenGL 2.1.
# =============================================================================

[properties]
# Architettura del container: x86 (32 bit) perche' l'immagine LineageOS 16.0
# ricostruita da prismOS e' x86 pura. Non usare x86_64: le immagini a 64 bit
# del progetto Waydroid sono compilate con -msse4.2 -mpopcnt.
arch = x86

# Percorso delle immagini. provision_waydroid_image.sh scarica o ricostruisce
# system.img / vendor.img LineageOS 16.0 (Android 9) con floor ISA SSE4.1.
images_path = /var/lib/waydroid/images

# Vendor MAINLINE: usa il kernel ospite (binderfs + ashmem) invece del vendor
# Halium, evitando un secondo kernel e ~250 MB di RAM.
vendor_type = MAINLINE

# Gralloc: minigbm e' l'unico allocator funzionante senza GPU Vulkan e senza
# GBM/DRI3 completo su Ironlake.
gralloc = minigbm

# Binder: binderfs (kernel >= 5.0). Il vecchio /dev/binder statico e' disattivato
# perche' ChromeOS monta /dev come tmpfs read-only al di fuori dei namespace.
binder = binderfs

# Geometria iniziale della finestra: i portatili legacy sono 1366x768.
width = 1366
height = 768
scale = 1.0
no_touch = False

# Multi-window: le app Android vengono esposte come finestre Ash separate.
multi_windows = True

# Niente OTA: l'immagine e' immutabile e firmata dal build prismOS. Un
# aggiornamento OTA reintrodurrebbe binari compilati con SSE4.2.
system_ota = 0
system_datetime = 1
system_halium = 0

# Overlay rw sopra /system e /vendor per le prop personalizzate.
mount_overlays = True

[lxc]
nic = waydroid0
protocol = static
ip = 192.168.240.112/24
gateway = 192.168.240.1
dns = 192.168.240.1
macaddr = 00:16:3e:0a:d0:53
no_overlay = False
